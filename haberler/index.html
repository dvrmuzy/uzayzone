<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: #050510;
  color: #e8e0f0;
  font-family: 'Nunito', sans-serif;
  overflow-x: hidden;
}

canvas#starfield {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}

.container {
  position: relative; z-index: 2;
  max-width: 760px; margin: 0 auto;
  padding: 84px 20px 60px;
}

header { text-align: center; margin-bottom: 12px; }

h1 {
  font-family: 'Orbitron', sans-serif; font-weight: 900;
  font-size: clamp(1.25rem, 4.4vw, 2.15rem); letter-spacing: 0.08em;
  line-height: 1.25;
  background: linear-gradient(120deg, #7df9ff 10%, #6bb6ff 50%, #b06bff 95%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 26px rgba(125, 249, 255, 0.26));
}

.aciklama {
  text-align: center; color: #9d97ba; font-size: 0.92rem;
  line-height: 1.6; margin-bottom: 24px;
}
.aciklama b { color: #7df9ff; }

/* ─── Ortak pano ─── */
.pano {
  background: linear-gradient(165deg, rgba(16, 22, 41, 0.9) 0%, rgba(7, 9, 22, 0.9) 75%);
  border: 1px solid rgba(107, 182, 255, 0.2);
  border-radius: 22px; padding: 22px 20px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
  margin-bottom: 26px;
}

.pano-baslik {
  font-family: 'Orbitron', sans-serif; font-weight: 900;
  font-size: 0.82rem; letter-spacing: 0.14em;
  color: #7fc4ff; margin-bottom: 14px;
}

/* ─── Filtreler ─── */
.filtreler {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-bottom: 24px;
}

.filtre {
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.04);
  color: #b9b2d4; cursor: pointer;
  font-family: 'Orbitron', sans-serif; font-weight: 700;
  font-size: 0.66rem; letter-spacing: 0.1em;
  padding: 9px 16px; border-radius: 30px;
  transition: all 0.25s ease;
}
.filtre:hover { color: #fff; border-color: rgba(255, 255, 255, 0.3); }
.filtre.secili {
  background: rgba(125, 249, 255, 0.14);
  border-color: rgba(125, 249, 255, 0.5);
  color: #7df9ff;
}

/* ─── Zaman çizgisi ─── */
.zaman-cizgisi { position: relative; padding-left: 26px; }

/* Kartların solundan geçen dikey çizgi */
.zaman-cizgisi::before {
  content: ''; position: absolute;
  left: 6px; top: 8px; bottom: 8px; width: 2px;
  background: linear-gradient(180deg,
    rgba(125, 249, 255, 0.5), rgba(176, 107, 255, 0.35), transparent);
}

.haber { position: relative; margin-bottom: 18px; }
.haber:last-child { margin-bottom: 0; }

/* Çizgi üzerindeki nokta — rengini durum belirler */
.haber::before {
  content: ''; position: absolute;
  left: -25px; top: 16px;
  width: 12px; height: 12px; border-radius: 50%;
  background: #7df9ff; border: 2px solid #050510;
  box-shadow: 0 0 12px rgba(125, 249, 255, 0.8);
}
.haber[data-durum="geldi"]::before {
  background: #4ade80; box-shadow: 0 0 12px rgba(74, 222, 128, 0.8);
}
.haber[data-durum="yapiliyor"]::before {
  background: #ffd75e; box-shadow: 0 0 12px rgba(255, 215, 94, 0.8);
}

.haber-kart {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 16px; padding: 16px 18px;
  transition: border-color 0.25s;
}
.haber-kart:hover { border-color: rgba(125, 249, 255, 0.28); }

.haber-ust {
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap; margin-bottom: 9px;
}

.rozet {
  font-family: 'Orbitron', sans-serif; font-weight: 700;
  font-size: 0.6rem; letter-spacing: 0.12em;
  padding: 4px 11px; border-radius: 30px;
  border: 1px solid; white-space: nowrap;
}
.rozet.gelecek   { color: #7df9ff; border-color: rgba(125, 249, 255, 0.4); background: rgba(125, 249, 255, 0.09); }
.rozet.yapiliyor { color: #ffd75e; border-color: rgba(255, 215, 94, 0.4);  background: rgba(255, 215, 94, 0.09); }
.rozet.geldi     { color: #4ade80; border-color: rgba(74, 222, 128, 0.4);  background: rgba(74, 222, 128, 0.09); }

.haber-tarih {
  color: #7a7396; font-size: 0.74rem; font-weight: 700;
  margin-left: auto;
}

.haber-baslik {
  font-family: 'Orbitron', sans-serif; font-weight: 700;
  font-size: 0.98rem; line-height: 1.35;
  color: #f0ecff; margin-bottom: 7px;
}

.haber-metin {
  color: #b9b2d4; font-size: 0.9rem;
  line-height: 1.65; white-space: pre-wrap;
}

.haber-islem { display: flex; gap: 8px; margin-top: 12px; }

.mini-buton {
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(255, 255, 255, 0.05);
  color: #b9b2d4; cursor: pointer;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  font-size: 0.74rem; padding: 6px 13px; border-radius: 20px;
  transition: all 0.2s;
}
.mini-buton:hover { color: #fff; border-color: rgba(255, 255, 255, 0.35); }
.mini-buton.sil:hover { color: #ff7b8f; border-color: rgba(255, 123, 143, 0.5); }

.yukleniyor, .bos {
  text-align: center; color: #7a7396;
  font-size: 0.88rem; padding: 22px 0;
}

/* ─── Yönetici formu ─── */
input.metin-giris, textarea, select {
  width: 100%; font-family: 'Nunito', sans-serif;
  font-size: 0.92rem; font-weight: 600; color: #e8e0f0;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.13);
  border-radius: 14px; padding: 12px 15px;
  outline: none; transition: border-color 0.2s;
}
textarea { resize: vertical; min-height: 96px; line-height: 1.55; margin-top: 10px; }
select { appearance: none; cursor: pointer; }
input.metin-giris:focus, textarea:focus, select:focus { border-color: rgba(125, 249, 255, 0.6); }

.form-alt {
  display: flex; align-items: center; gap: 10px;
  margin-top: 10px; flex-wrap: wrap;
}
.form-alt select { flex: 1; min-width: 150px; width: auto; }

.buton {
  border: 0; border-radius: 30px; cursor: pointer;
  padding: 12px 24px; white-space: nowrap;
  background: linear-gradient(135deg, #7df9ff, #b06bff); color: #08061a;
  font-family: 'Orbitron', sans-serif; font-weight: 900;
  font-size: 0.7rem; letter-spacing: 0.12em;
  transition: transform 0.2s, box-shadow 0.2s;
}
.buton:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(125, 249, 255, 0.3); }
.buton:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.buton.ikincil {
  background: none; color: #9d97ba;
  border: 1px solid rgba(255, 255, 255, 0.16);
}
.buton.ikincil:hover { color: #fff; box-shadow: none; }

.durum {
  margin-top: 10px; font-size: 0.84rem;
  font-weight: 700; min-height: 1.1em;
}
.durum.hata { color: #ff7b8f; }
.durum.iyi  { color: #4ade80; }

.alt-not {
  text-align: center; color: #6d6788;
  font-size: 0.78rem; line-height: 1.6; margin-top: 6px;
}

@media (max-width: 520px) {
  .container { padding: 74px 14px 50px; }
  .pano { padding: 18px 15px; border-radius: 18px; }
  .zaman-cizgisi { padding-left: 20px; }
  .haber::before { left: -20px; width: 10px; height: 10px; }
  .haber-tarih { margin-left: 0; width: 100%; }
}
</style>
</head>

<div class="container">
  <header>
    <h1>HABERLER</h1>
  </header>
  <p class="aciklama">
    Siteye <b>ne geldi</b>, <b>ne yapılıyor</b>, <b>sırada ne var</b> — hepsi burada.<br>
    Yeni oyunlar, düzeltmeler ve planlar bu sayfadan duyurulur.
  </p>

  <nav class="filtreler" id="filtreler" aria-label="Haber durumu filtresi">
    <button class="filtre secili" type="button" data-filtre="hepsi">TÜMÜ</button>
    <button class="filtre" type="button" data-filtre="geldi">✅ YAYINDA</button>
    <button class="filtre" type="button" data-filtre="yapiliyor">🔧 YAPILIYOR</button>

  <!-- Yalnızca yönetici uid'lerinde görünür (yoneticiler/$uid === true) -->

    <div class="form-alt">
      <select id="haberDurum" aria-label="Haber durumu">
        <option value="geldi">✅ Yayında — geldi</option>

    </div>
    <p class="durum" id="formDurum"></p>
  </section>

  <section class="pano">
    <h2 class="pano-baslik">🛰️ SON HABERLER</h2>
    <div class="zaman-cizgisi" id="liste"><p class="yukleniyor">Yükleniyor…</p></div>
  </section>

  <p class="alt-not">
    Bir fikrin mi var? <a href="../sikayetler/" style="color:#ff8fa8;font-weight:800;text-decoration:none">Şikayet ve Öneri</a> sayfasından yaz — buraya haber olarak düşebilir 🙂
  </p>

<script>
// ─── Yıldız Alanı ───
(function () {
  const cv = document.getElementById('starfield');
  const ctx = cv.getContext('2d');
  let yildizlar = [];

  function kur() {
    cv.width  = innerWidth;
    cv.height = innerHeight;
    const adet = Math.min(220, Math.floor(innerWidth * innerHeight / 9000));
    yildizlar = Array.from({ length: adet }, () => ({
      x: Math.random() * cv.width,
      y: Math.random() * cv.height,
      r: Math.random() * 1.3 + 0.3,
      p: Math.random() * Math.PI * 2,
      h: Math.random() * 0.02 + 0.008
    }));
  }

  function ciz() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const y of yildizlar) {
      y.p += y.h;
      const parlaklik = 0.35 + Math.sin(y.p) * 0.3;
      ctx.beginPath();
      ctx.arc(y.x, y.y, y.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(190, 215, 255, ' + parlaklik.toFixed(3) + ')';
      ctx.fill();
    }
    requestAnimationFrame(ciz);
  }

  kur();
  addEventListener('resize', kur);
  ciz();
})();
</script>

<script type="module">
// ═══════════════════════════════════════════════════════════
//  Haberler — yol haritası / duyuru akışı
//
//  Veri (Realtime Database, kurallar firebase-rules.json içinde):
//    haberler/$id  = { baslik, metin, durum, tarih }
//                    durum: 'geldi' | 'yapiliyor' | 'gelecek'
//    yoneticiler/$uid = true   → yalnızca bu uid'ler haber yazabilir
//
//  Okuma herkese açık, YAZMA yalnızca yöneticiye. Yönetici listesi
//  tarayıcıdan DEĞİŞTİRİLEMEZ (kural: yoneticiler'e yazma kapalı) —
//  kendini yönetici yapmak için Firebase konsolundan
//  yoneticiler/<uid> = true düğümünü elle ekle. Kendi uid'ini
//  öğrenmek için siteye gir ve konsola şunu yaz:
//    UzayHesap.kullanici().uid
// ═══════════════════════════════════════════════════════════
import {
  ref, push, set, update, remove, get, onValue, query, orderByChild, limitToLast, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
import { db } from '../firebase-init.js';

const EN_FAZLA = 60;   // listede gösterilen en yeni haber sayısı

// Ana sayfadaki "YENİ" rozeti bu anahtarı okur — buraya girildiğinde söner.
const GORULEN_ANAHTAR = 'uz_haber_gorulen';

const DURUMLAR = {
  geldi:     { etiket: '✅ YAYINDA'   },
  yapiliyor: { etiket: '🔧 YAPILIYOR' },
  gelecek:   { etiket: '🔭 YAKINDA'   }
};

const $ = id => document.getElementById(id);
const kacisla = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let ben = null;         // { uid, nick, coin } | null
let yonetici = false;   // yoneticiler/<uid> === true mi
let haberler = [];      // en yeniden eskiye
let yuklendi = false;   // ilk okuma gelmeden "haber yok" yazmayalım
let filtre = 'hepsi';
let duzenlenen = null;  // düzenleme modundaki haberin id'si | null

function tarihMetni(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('tr-TR',
    { day: 'numeric', month: 'long', year: 'numeric' });
}

function durumYaz(metin, sinif) {
  const el = $('formDurum');
  el.textContent = metin || '';
  el.className = 'durum' + (sinif ? ' ' + sinif : '');
}

// ═══ Liste ═══
function listeyiCiz() {
  const kap = $('liste');
  if (!yuklendi) { kap.innerHTML = '<p class="yukleniyor">Yükleniyor…</p>'; return; }

  const gosterilen = haberler.filter(h => filtre === 'hepsi' || h.durum === filtre);

  if (!gosterilen.length) {
    kap.innerHTML = '<p class="bos">' +
      (haberler.length ? 'Bu durumda haber yok.' : 'Henüz haber yok — yakında burada olacak.') +
      '</p>';
    return;
  }

  kap.innerHTML = gosterilen.map(h => {
    const d = DURUMLAR[h.durum] || DURUMLAR.gelecek;
    const islem = yonetici
      ? '<div class="haber-islem">' +
          '<button class="mini-buton" type="button" data-duzenle="' + h.id + '">Düzenle</button>' +
          '<button class="mini-buton sil" type="button" data-sil="' + h.id + '">Sil</button>' +
        '</div>'
      : '';
    return '<article class="haber" data-durum="' + kacisla(h.durum) + '">' +
      '<div class="haber-kart">' +
        '<div class="haber-ust">' +
          '<span class="rozet ' + kacisla(h.durum) + '">' + d.etiket + '</span>' +
          '<span class="haber-tarih">' + kacisla(tarihMetni(h.tarih)) + '</span>' +
        '</div>' +
        '<h3 class="haber-baslik">' + kacisla(h.baslik) + '</h3>' +
        '<p class="haber-metin">' + kacisla(h.metin) + '</p>' +
        islem +
      '</div>' +
    '</article>';
  }).join('');
}

// Kartlar her çizimde yeniden üretiliyor — dinleyici kapsayıcıda durur.
$('liste').addEventListener('click', e => {
  const duzenleBtn = e.target.closest('[data-duzenle]');
  if (duzenleBtn) { duzenlemeyeAl(duzenleBtn.dataset.duzenle); return; }

  const silBtn = e.target.closest('[data-sil]');
  if (silBtn) haberSil(silBtn.dataset.sil);
});

// ═══ Filtreler ═══
$('filtreler').addEventListener('click', e => {
  const btn = e.target.closest('[data-filtre]');
  if (!btn) return;
  filtre = btn.dataset.filtre;
  $('filtreler').querySelectorAll('.filtre')
    .forEach(b => b.classList.toggle('secili', b === btn));
  listeyiCiz();
});

// ═══ Yönetici formu ═══
function formuTemizle() {
  duzenlenen = null;
  $('haberBaslik').value = '';
  $('haberMetin').value = '';
  $('haberDurum').value = 'geldi';
  $('formBaslik').textContent = '📡 YENİ HABER YAZ';
  $('haberKaydet').textContent = 'YAYINLA';
  $('haberIptal').style.display = 'none';
  durumYaz('');
}

function duzenlemeyeAl(id) {
  const h = haberler.find(x => x.id === id);
  if (!h) return;
  duzenlenen = id;
  $('haberBaslik').value = h.baslik || '';
  $('haberMetin').value = h.metin || '';
  $('haberDurum').value = h.durum || 'geldi';
  $('formBaslik').textContent = '✏️ HABERİ DÜZENLE';
  $('haberKaydet').textContent = 'KAYDET';
  $('haberIptal').style.display = 'inline-block';
  $('yoneticiPano').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

$('haberIptal').addEventListener('click', formuTemizle);

$('haberKaydet').addEventListener('click', async () => {
  if (!yonetici) { durumYaz('Bunun için yönetici olman gerekiyor.', 'hata'); return; }

  const baslik = $('haberBaslik').value.trim();
  const metin  = $('haberMetin').value.trim();
  const durum  = $('haberDurum').value;

  if (baslik.length < 2)  { durumYaz('Başlık çok kısa.', 'hata'); return; }
  if (metin.length < 1)   { durumYaz('Açıklama boş olamaz.', 'hata'); return; }
  if (!DURUMLAR[durum])   { durumYaz('Geçersiz durum.', 'hata'); return; }

  $('haberKaydet').disabled = true;
  durumYaz('Kaydediliyor…');
  try {
    let sonuc;
    if (duzenlenen) {
      // tarih'e dokunmuyoruz — haberin özgün yayın tarihi kalsın
      await update(ref(db, 'haberler/' + duzenlenen), { baslik, metin, durum });
      sonuc = 'Güncellendi ✓';
    } else {
      await set(push(ref(db, 'haberler')), { baslik, metin, durum, tarih: serverTimestamp() });
      sonuc = 'Yayınlandı ✓';
    }
    formuTemizle();          // durum satırını da siler, mesajı sonra yazıyoruz
    durumYaz(sonuc, 'iyi');
  } catch (hata) {
    console.warn('[haberler] yazılamadı', hata);
    durumYaz('Kaydedilemedi: ' + (hata.code || hata.message || 'bilinmeyen hata'), 'hata');
  } finally {
    $('haberKaydet').disabled = false;
  }
});

async function haberSil(id) {
  if (!yonetici) return;
  const h = haberler.find(x => x.id === id);
  if (!confirm('"' + (h ? h.baslik : 'Bu haber') + '" silinsin mi?')) return;
  try {
    await remove(ref(db, 'haberler/' + id));
    if (duzenlenen === id) formuTemizle();
  } catch (hata) {
    console.warn('[haberler] silinemedi', hata);
    durumYaz('Silinemedi: ' + (hata.code || hata.message || 'bilinmeyen hata'), 'hata');
  }
}

// ═══ Veri ═══
onValue(query(ref(db, 'haberler'), orderByChild('tarih'), limitToLast(EN_FAZLA)), anlik => {
  const ham = anlik.val() || {};
  yuklendi = true;
  haberler = Object.keys(ham)
    .map(id => Object.assign({ id }, ham[id]))
    .sort((a, b) => (b.tarih || 0) - (a.tarih || 0));
  listeyiCiz();

  // En yeni haberin tarihi işaretlensin — ana sayfadaki "YENİ" rozeti sönsün
  const enYeni = haberler.reduce((en, h) => Math.max(en, h.tarih || 0), 0);
  if (enYeni) { try { localStorage.setItem(GORULEN_ANAHTAR, String(enYeni)); } catch (e) {} }
}, hata => {
  console.warn('[haberler] okunamadı', hata);
  yuklendi = true;   // sonraki çizimler "Yükleniyor…"da takılı kalmasın
  $('liste').innerHTML = '<p class="bos">Haberler şu an okunamıyor.</p>';
});

// ═══ Hesap ═══
// Yönetici panosu yalnızca yoneticiler/<uid> === true olan hesapta açılır.
// Kural da aynı düğüme bakar; panoyu zorla açmak yazma hakkı vermez.
async function yoneticiKontrol() {
  const oncekiDurum = yonetici;
  yonetici = false;
  if (ben) {
    try {
      const anlik = await get(ref(db, 'yoneticiler/' + ben.uid));
      yonetici = anlik.val() === true;
    } catch (e) {
      console.warn('[haberler] yönetici kontrolü başarısız', e);
    }
  }
  $('yoneticiPano').style.display = yonetici ? 'block' : 'none';
  if (!yonetici && oncekiDurum) formuTemizle();
  listeyiCiz();
}

function hesapBekle(kalanDeneme) {
  if (window.UzayHesap) {
    window.UzayHesap.onDegisim(kullanan => {
      const oncekiUid = ben && ben.uid;
      ben = kullanan;
      if ((ben && ben.uid) !== oncekiUid) yoneticiKontrol();
    });
    return;
  }
  // file:// ile açıldıysa ya da Firebase kapalıysa sayfa okunur kalsın
  if (kalanDeneme > 0) setTimeout(() => hesapBekle(kalanDeneme - 1), 150);
}
hesapBekle(20);
</script>
