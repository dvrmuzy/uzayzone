<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: #050510;
  color: #e8e0f0;
  font-family: 'Nunito', sans-serif;
  overflow-x: hidden;
}

canvas#starfield {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

.nebula-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 15% 25%, rgba(100, 40, 180, 0.13), transparent 55%),
    radial-gradient(ellipse at 85% 75%, rgba(0, 100, 220, 0.09), transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(120, 60, 200, 0.05), transparent 70%);
}

.container {
  position: relative;
  z-index: 2;
  max-width: 1040px;
  margin: 0 auto;
  padding: 40px 20px 60px;
}

/* ─── Header ─── */
header {
  text-align: center;
  margin-bottom: 60px;
  padding-top: 30px;
}

.site-logo {
  width: 100%;
  max-width: 560px;
  height: auto;
  filter: drop-shadow(0 0 40px rgba(0, 200, 255, 0.18));
  animation: logoFloat 5s ease-in-out infinite;
}

.site-title-fallback { display: none; }

@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* ─── Games Grid ─── */
.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 32px;
  margin-bottom: 60px;
}

/* ─── Game Card ─── */
.game-card {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  text-decoration: none;
  color: #e8e0f0;
  display: flex;
  flex-direction: column;
  transition: transform 0.35s ease, box-shadow 0.35s ease;
  opacity: 0;
  animation: fadeInUp 0.6s ease forwards;
}

.game-card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 20px 60px var(--card-glow), 0 0 40px var(--card-glow);
}

.card-top-bar {
  height: 4px;
  background: var(--card-bar);
  transition: height 0.3s ease;
}

.game-card:hover .card-top-bar {
  height: 5px;
}

.card-body {
  padding: 32px 28px 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.card-icon {
  font-size: 3rem;
  margin-bottom: 16px;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 4px 12px var(--card-glow));
}

.card-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 1.35rem;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
  color: #fff;
}

.card-genre {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--card-accent);
  margin-bottom: 14px;
  opacity: 0.9;
}

.card-desc {
  font-size: 0.92rem;
  line-height: 1.6;
  color: #aaa8c0;
  flex: 1;
}

.card-footer {
  padding: 18px 28px 24px;
  text-align: center;
}

.play-btn {
  display: inline-block;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.12em;
  color: var(--card-accent);
  border: 1.5px solid var(--card-accent);
  border-radius: 30px;
  padding: 10px 32px;
  transition: all 0.3s ease;
  background: transparent;
}

.game-card:hover .play-btn {
  background: var(--card-accent);
  color: #050510;
  box-shadow: 0 0 20px var(--card-glow);
}

/* ─── New Game Highlight ─── */
.game-card.is-new {
  border-color: var(--card-accent);
  box-shadow: 0 0 24px var(--card-glow);
}

.game-card.is-new::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 20px;
  pointer-events: none;
  z-index: 3;
  box-shadow: inset 0 0 0 1.5px var(--card-accent);
  animation: newRing 1.8s ease-in-out infinite;
}

.game-card.is-new:hover {
  box-shadow: 0 20px 60px var(--card-glow), 0 0 50px var(--card-glow);
}

.new-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 5;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 0.62rem;
  letter-spacing: 0.15em;
  color: #050510;
  background: var(--card-accent);
  padding: 4px 11px;
  border-radius: 20px;
  box-shadow: 0 0 14px var(--card-glow);
  animation: badgePulse 1.5s ease-in-out infinite;
}

/* ─── Footer ─── */
footer {
  text-align: center;
  color: #555568;
  font-size: 0.82rem;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.05);
}

/* ─── Animations ─── */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes newRing {
  0%, 100% { box-shadow: inset 0 0 0 1.5px var(--card-accent); opacity: 0.7; }
  50% { box-shadow: inset 0 0 0 2.5px var(--card-accent); opacity: 1; }
}

@keyframes badgePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* ─── Responsive ─── */
@media (max-width: 640px) {
  .site-logo { max-width: 88%; }
  header { margin-bottom: 40px; padding-top: 20px; }
  .games-grid { gap: 24px; }
  .card-body { padding: 24px 20px 16px; }
  .card-icon { font-size: 2.4rem; }
  .card-title { font-size: 1.15rem; }
}

@media (max-width: 380px) {
  .games-grid { grid-template-columns: 1fr; }
}
</style>

// Son eklenen kaç oyun "YENİ" olarak vurgulansın (array'in sonundakiler)
const NEW_COUNT = 4;

// ─── Render Cards ───
function renderCards() {
  const grid = document.getElementById('gamesGrid');
  // En son eklenen oyunlar (array'in sonundakiler) en başta gözüksün
  const ordered = GAMES
    .map((g, idx) => ({ ...g, isNew: idx >= GAMES.length - NEW_COUNT }))
    .reverse();
  grid.innerHTML = ordered.map((g, i) => `
    <a href="${g.href}" class="game-card${g.isNew ? ' is-new' : ''}"
       style="--card-bg:${g.colors.bg};--card-accent:${g.colors.accent};--card-glow:${g.colors.glow};--card-bar:${g.colors.bar};--card-border:${g.colors.border};animation-delay:${i * 0.12}s">
      ${g.isNew ? '<span class="new-badge">YENİ</span>' : ''}
      <div class="card-top-bar"></div>
      <div class="card-body">
        <div class="card-icon">${g.icon}</div>
        <h2 class="card-title">${g.title}</h2>
        <p class="card-genre">${g.genre}</p>
        <p class="card-desc">${g.desc}</p>
      </div>
      <div class="card-footer">
        <span class="play-btn">OYNA →</span>
      </div>
    </a>
  `).join('');
}

// ─── Uzay Sahnesi ───
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
let shootingStars = [];
let planets = [];
let asteroids = [];
let astronauts = [];
let shuttles = [];
let meteors = [];
let sparks = [];
let explosions = [];
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function createStars() {
  stars = [];
  const count = Math.floor((W * H) / 4000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      speed: Math.random() * 0.15 + 0.02,
      opacity: Math.random() * 0.6 + 0.3,
      twinkleSpeed: Math.random() * 0.008 + 0.002,
      twinklePhase: Math.random() * Math.PI * 2
    });
  }
}

  { base: '#3c9ee0', mid: '#2570ab', dark: '#144a78', ring: null },
  { base: '#d05a78', mid: '#a03a58', dark: '#6a2038', ring: null },
  { base: '#4fc9a0', mid: '#35a07a', dark: '#206850', ring: 'rgba(160,255,220,0.4)' }
];

function createPlanets() {
  planets = [];
  const count = W < 700 ? 2 : 3;
  for (let i = 0; i < count; i++) {
    const pal = PLANET_PALETTES[Math.floor(Math.random() * PLANET_PALETTES.length)];
    planets.push({
      x: (i + 0.5) / count * W + (Math.random() - 0.5) * W * 0.2,
      y: Math.random() * H,
      r: Math.random() * 22 + 18,
      vx: (Math.random() - 0.5) * 0.08,
      vy: Math.random() * 0.05 + 0.02,
      pal,
      hasRing: pal.ring !== null && Math.random() < 0.8,
      ringTilt: Math.random() * 0.5 + 0.25,
      spots: Array.from({ length: 3 }, () => ({
        a: Math.random() * Math.PI * 2,
        d: Math.random() * 0.6 + 0.1,
        r: Math.random() * 0.25 + 0.1
      })),
      hitFlash: 0
    });
  }
}

function drawPlanet(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  // Halkanın arka yarısı
  if (p.hasRing) {
    ctx.strokeStyle = p.pal.ring;
    ctx.lineWidth = p.r * 0.18;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r * 1.7, p.r * 1.7 * p.ringTilt, -0.3, Math.PI, Math.PI * 2);
    ctx.stroke();
  }
  // Gövde
  const grad = ctx.createRadialGradient(-p.r * 0.35, -p.r * 0.35, p.r * 0.1, 0, 0, p.r);
  grad.addColorStop(0, p.pal.base);
  grad.addColorStop(0.6, p.pal.mid);
  grad.addColorStop(1, p.pal.dark);
  ctx.beginPath();
  ctx.arc(0, 0, p.r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
  // Yüzey lekeleri
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, p.r, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  for (const sp of p.spots) {
    ctx.beginPath();
    ctx.ellipse(Math.cos(sp.a) * p.r * sp.d, Math.sin(sp.a) * p.r * sp.d, p.r * sp.r * 1.6, p.r * sp.r, sp.a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  // Çarpma parlaması
  if (p.hitFlash > 0) {
    ctx.beginPath();
    ctx.arc(0, 0, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 200, 120, ${p.hitFlash * 0.55})`;
    ctx.fill();
  }
  // Halkanın ön yarısı
  if (p.hasRing) {
    ctx.strokeStyle = p.pal.ring;
    ctx.lineWidth = p.r * 0.18;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r * 1.7, p.r * 1.7 * p.ringTilt, -0.3, 0, Math.PI);
    ctx.stroke();
  }
  ctx.restore();
}

// ─── Asteroidler ───
function createAsteroids() {
  asteroids = [];
  const count = W < 700 ? 3 : 5;
  for (let i = 0; i < count; i++) {
    const r = Math.random() * 7 + 5;
    const verts = [];
    const n = 8;
    for (let j = 0; j < n; j++) {
      verts.push(r * (0.75 + Math.random() * 0.4));
    }
    asteroids.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r, verts,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.01
    });
  }
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.beginPath();
  const n = a.verts.length;
  for (let j = 0; j < n; j++) {
    const ang = (j / n) * Math.PI * 2;
    const d = a.verts[j];
    if (j === 0) ctx.moveTo(Math.cos(ang) * d, Math.sin(ang) * d);
    else ctx.lineTo(Math.cos(ang) * d, Math.sin(ang) * d);
  }
  ctx.closePath();
  const grad = ctx.createRadialGradient(-a.r * 0.3, -a.r * 0.3, a.r * 0.1, 0, 0, a.r * 1.2);
  grad.addColorStop(0, '#9a8a7a');
  grad.addColorStop(1, '#4a4038');
  ctx.fillStyle = grad;
  ctx.fill();
  // Kraterler
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.arc(a.r * 0.3, -a.r * 0.2, a.r * 0.2, 0, Math.PI * 2);
  ctx.arc(-a.r * 0.35, a.r * 0.3, a.r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ─── Astronotlar ───
function createAstronauts() {
  astronauts = [];
  const count = W < 700 ? 1 : 2;
  for (let i = 0; i < count; i++) {
    astronauts.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: Math.random() * 0.4 + 0.8,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.15,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.006,
      bobPhase: Math.random() * Math.PI * 2
    });
  }
}

function drawAstronaut(a) {
  ctx.save();
  ctx.translate(a.x, a.y + Math.sin(a.bobPhase) * 4);
  ctx.rotate(a.rot);
  ctx.scale(a.s, a.s);
  ctx.lineCap = 'round';
  // Sırt çantası
  ctx.fillStyle = '#8a93a8';
  ctx.fillRect(-9, -8, 18, 14);
  // Kollar
  ctx.strokeStyle = '#dde3ee';
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(-6, -2); ctx.lineTo(-13, 5);
  ctx.moveTo(6, -2); ctx.lineTo(13, 4);
  ctx.stroke();
  // Bacaklar
  ctx.beginPath();
  ctx.moveTo(-3.5, 9); ctx.lineTo(-6, 18);
  ctx.moveTo(3.5, 9); ctx.lineTo(6, 18);
  ctx.stroke();
  // Gövde
  ctx.fillStyle = '#e8ecf5';
  ctx.beginPath();
  ctx.ellipse(0, 2, 8, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  // Kask
  ctx.beginPath();
  ctx.arc(0, -10, 7.5, 0, Math.PI * 2);
  ctx.fill();
  // Vizör
  ctx.fillStyle = '#1a2a50';
  ctx.beginPath();
  ctx.ellipse(0, -10, 5.5, 4.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Vizör yansıması
  ctx.fillStyle = 'rgba(160,210,255,0.7)';
  ctx.beginPath();
  ctx.ellipse(-1.8, -11.5, 1.8, 1.1, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ─── Uzay Mekikleri ───
function spawnShuttle() {
  const fromLeft = Math.random() < 0.5;
  const angle = (fromLeft ? 0 : Math.PI) + (Math.random() - 0.5) * 0.5;
  shuttles.push({
    x: fromLeft ? -50 : W + 50,
    y: Math.random() * H * 0.7 + H * 0.1,
    angle,
    speed: Math.random() * 1 + 1.2,
    s: Math.random() * 0.4 + 0.8,
    flame: 0
  });
}

function drawShuttle(sh) {
  ctx.save();
  ctx.translate(sh.x, sh.y);
  ctx.rotate(sh.angle);
  ctx.scale(sh.s, sh.s);
  // Alev
  sh.flame += 0.3;
  const fl = 12 + Math.sin(sh.flame) * 4;
  const fgrad = ctx.createLinearGradient(-18, 0, -18 - fl, 0);
  fgrad.addColorStop(0, 'rgba(255,200,80,0.95)');
  fgrad.addColorStop(0.5, 'rgba(255,120,40,0.7)');
  fgrad.addColorStop(1, 'rgba(255,80,20,0)');
  ctx.fillStyle = fgrad;
  ctx.beginPath();
  ctx.moveTo(-17, -4);
  ctx.lineTo(-18 - fl, 0);
  ctx.lineTo(-17, 4);
  ctx.closePath();
  ctx.fill();
  // Kanatlar
  ctx.fillStyle = '#c44a5a';
  ctx.beginPath();
  ctx.moveTo(-8, -5); ctx.lineTo(-18, -12); ctx.lineTo(-16, -3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-8, 5); ctx.lineTo(-18, 12); ctx.lineTo(-16, 3);
  ctx.closePath(); ctx.fill();
  // Gövde
  const bgrad = ctx.createLinearGradient(0, -6, 0, 6);
  bgrad.addColorStop(0, '#f0f3fa');
  bgrad.addColorStop(1, '#b8c0d0');
  ctx.fillStyle = bgrad;
  ctx.beginPath();
  ctx.moveTo(-17, -5);
  ctx.lineTo(8, -5);
  ctx.quadraticCurveTo(20, 0, 8, 5);
  ctx.lineTo(-17, 5);
  ctx.closePath();
  ctx.fill();
  // Burun
  ctx.fillStyle = '#c44a5a';
  ctx.beginPath();
  ctx.moveTo(8, -5);
  ctx.quadraticCurveTo(20, 0, 8, 5);
  ctx.quadraticCurveTo(13, 0, 8, -5);
  ctx.closePath();
  ctx.fill();
  // Pencere
  ctx.fillStyle = '#1a2a50';
  ctx.beginPath();
  ctx.arc(2, 0, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(160,210,255,0.8)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
}

// ─── Meteorlar ve Patlamalar ───
function spawnMeteor() {
  const x = Math.random() * W;
  const y = -30;
  let angle, target = null;
  // Bazen bir gezegeni hedef al
  if (planets.length && Math.random() < 0.45) {
    target = planets[Math.floor(Math.random() * planets.length)];
    angle = Math.atan2(target.y - y, target.x - x);
  } else {
    angle = Math.PI / 2 + (Math.random() - 0.5) * 1.4;
  }
  meteors.push({
    x, y, angle, target,
    speed: Math.random() * 2 + 2.5,
    size: Math.random() * 2.5 + 2,
    len: Math.random() * 50 + 50
  });
}

function explode(x, y, power) {
  explosions.push({ x, y, age: 0, max: 45, power });
  const n = Math.floor(power * 8 + 12);
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = Math.random() * power * 1.2 + 0.5;
    sparks.push({
      x, y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      life: 1,
      decay: Math.random() * 0.02 + 0.015,
      r: Math.random() * 2 + 1,
      hue: Math.random() * 40 + 15
    });
  }
}

function drawMeteor(m) {
  const tailX = m.x - Math.cos(m.angle) * m.len;
  const tailY = m.y - Math.sin(m.angle) * m.len;
  const grad = ctx.createLinearGradient(tailX, tailY, m.x, m.y);
  grad.addColorStop(0, 'rgba(255,100,30,0)');
  grad.addColorStop(0.6, 'rgba(255,140,50,0.45)');
  grad.addColorStop(1, 'rgba(255,220,150,0.95)');
  ctx.beginPath();
  ctx.moveTo(tailX, tailY);
  ctx.lineTo(m.x, m.y);
  ctx.strokeStyle = grad;
  ctx.lineWidth = m.size * 1.4;
  ctx.lineCap = 'round';
  ctx.stroke();
  // Kor halindeki kaya
  const hgrad = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.size * 2);
  hgrad.addColorStop(0, 'rgba(255,240,200,1)');
  hgrad.addColorStop(0.5, 'rgba(255,160,60,0.8)');
  hgrad.addColorStop(1, 'rgba(255,100,30,0)');
  ctx.beginPath();
  ctx.arc(m.x, m.y, m.size * 2, 0, Math.PI * 2);
  ctx.fillStyle = hgrad;
  ctx.fill();
}

function animate() {
  ctx.clearRect(0, 0, W, H);

  // Yıldızlar
  for (const s of stars) {
    s.y += s.speed;
    s.twinklePhase += s.twinkleSpeed;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    const twinkle = Math.sin(s.twinklePhase) * 0.3 + 0.7;
    const alpha = s.opacity * twinkle;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220, 225, 255, ${alpha})`;
    ctx.fill();
  }

  // Gezegenler
  for (const p of planets) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.hitFlash > 0) p.hitFlash -= 0.02;
    const m = p.r * 2.2;
    if (p.y - m > H) { p.y = -m; p.x = Math.random() * W; }
    if (p.x - m > W) p.x = -m;
    if (p.x + m < 0) p.x = W + m;
    drawPlanet(p);
  }

  // Asteroidler
  for (const a of asteroids) {
    a.x += a.vx;
    a.y += a.vy;
    a.rot += a.rotSpeed;
    if (a.x - a.r > W) a.x = -a.r;
    if (a.x + a.r < 0) a.x = W + a.r;
    if (a.y - a.r > H) a.y = -a.r;
    if (a.y + a.r < 0) a.y = H + a.r;
    drawAsteroid(a);
  }

  // Astronotlar
  for (const a of astronauts) {
    a.x += a.vx;
    a.y += a.vy;
    a.rot += a.rotSpeed;
    a.bobPhase += 0.02;
    const m = 30 * a.s;
    if (a.x - m > W) a.x = -m;
    if (a.x + m < 0) a.x = W + m;
    if (a.y - m > H) a.y = -m;
    if (a.y + m < 0) a.y = H + m;
    drawAstronaut(a);
  }

  // Uzay mekikleri
  for (let i = shuttles.length - 1; i >= 0; i--) {
    const sh = shuttles[i];
    sh.x += Math.cos(sh.angle) * sh.speed;
    sh.y += Math.sin(sh.angle) * sh.speed;
    if (sh.x < -80 || sh.x > W + 80 || sh.y < -80 || sh.y > H + 80) {
      shuttles.splice(i, 1);
      continue;
    }
    drawShuttle(sh);
  }

  // Kayan yıldızlar
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const ss = shootingStars[i];
    ss.x += Math.cos(ss.angle) * ss.speed;
    ss.y += Math.sin(ss.angle) * ss.speed;
    ss.life -= 0.015;
    ss.opacity = ss.life;
    if (ss.life <= 0) { shootingStars.splice(i, 1); continue; }
    const tailX = ss.x - Math.cos(ss.angle) * ss.len;
    const tailY = ss.y - Math.sin(ss.angle) * ss.len;
    const grad = ctx.createLinearGradient(tailX, tailY, ss.x, ss.y);
    grad.addColorStop(0, `rgba(200, 220, 255, 0)`);
    grad.addColorStop(1, `rgba(200, 220, 255, ${ss.opacity})`);
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(ss.x, ss.y);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Meteorlar
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += Math.cos(m.angle) * m.speed;
    m.y += Math.sin(m.angle) * m.speed;
    // Hedef gezegen hareket ettiyse rotayı hafifçe düzelt
    if (m.target) {
      m.angle = Math.atan2(m.target.y - m.y, m.target.x - m.x);
      const dx = m.target.x - m.x;
      const dy = m.target.y - m.y;
      if (dx * dx + dy * dy < m.target.r * m.target.r) {
        m.target.hitFlash = 1;
        explode(m.x, m.y, m.size);
        meteors.splice(i, 1);
        continue;
      }
    }
    if (m.x < -100 || m.x > W + 100 || m.y > H + 100) {
      meteors.splice(i, 1);
      continue;
    }
    drawMeteor(m);
  }

  // Kıvılcımlar
  for (let i = sparks.length - 1; i >= 0; i--) {
    const sp = sparks[i];
    sp.x += sp.vx;
    sp.y += sp.vy;
    sp.vx *= 0.97;
    sp.vy *= 0.97;
    sp.life -= sp.decay;
    if (sp.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, sp.r * sp.life, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${sp.hue}, 100%, ${55 + sp.life * 30}%, ${sp.life})`;
    ctx.fill();
  }

  // Patlama halkaları
  for (let i = explosions.length - 1; i >= 0; i--) {
    const ex = explosions[i];
    ex.age++;
    if (ex.age > ex.max) { explosions.splice(i, 1); continue; }
    const t = ex.age / ex.max;
    // Parlak merkez
    if (t < 0.3) {
      const fgrad = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, ex.power * 8);
      fgrad.addColorStop(0, `rgba(255,250,220,${(1 - t / 0.3) * 0.9})`);
      fgrad.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.beginPath();
      ctx.arc(ex.x, ex.y, ex.power * 8, 0, Math.PI * 2);
      ctx.fillStyle = fgrad;
      ctx.fill();
    }
    // Şok dalgası
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, t * ex.power * 14, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 190, 110, ${(1 - t) * 0.7})`;
    ctx.lineWidth = 2 * (1 - t) + 0.5;
    ctx.stroke();
  }

  // Rastgele olaylar
  if (Math.random() < 0.003) spawnShootingStar();
  if (Math.random() < 0.0025) spawnMeteor();
  if (shuttles.length < 2 && Math.random() < 0.0009) spawnShuttle();

  requestAnimationFrame(animate);
}

function spawnShootingStar() {
  shootingStars.push({
    x: Math.random() * W * 0.8,
    y: Math.random() * H * 0.3,
    len: Math.random() * 80 + 40,
    speed: Math.random() * 6 + 4,
    angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
    opacity: 1,
    life: 1
  });
}

// ─── Init ───
window.addEventListener('resize', () => {
  resize();
  createStars();
  createPlanets();
  createAsteroids();
  createAstronauts();
});
resize();
createStars();
createPlanets();
createAsteroids();
createAstronauts();
renderCards();
animate();
</script>
