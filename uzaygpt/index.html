<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UzayGPT - Uzay Zone</title>
<link rel="icon" href="../logo/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="../logo/favicon.svg">
<link rel="apple-touch-icon" href="../logo/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="../analytics.js"></script>
<script src="../hesap.js" defer></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --mor: #b44eff;
  --mavi: #7df9ff;
  --pembe: #ff4f8a;
  --zemin: #05040f;
}

html, body { height: 100%; }

body {
  background: var(--zemin);
  color: #e8e0f0;
  font-family: 'Nunito', sans-serif;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}

canvas#starfield {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}

.nebula {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 45% at 15% 8%, rgba(180,78,255,0.16), transparent 60%),
    radial-gradient(ellipse 55% 40% at 88% 78%, rgba(125,249,255,0.12), transparent 60%);
}

/* ─── Yerleşim ─── */
.sayfa {
  position: relative; z-index: 1;
  height: 100dvh;
  display: flex; flex-direction: column;
  max-width: 860px; margin: 0 auto;
  padding: 0 14px;
}

/* Üst şerit */
.ust {
  flex: none;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 0 10px;
}

.geri {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 30px;
  background: rgba(2,3,15,0.7); color: var(--mavi);
  font-family: 'Orbitron', sans-serif; font-size: 0.64rem;
  font-weight: 700; letter-spacing: 0.12em;
  text-decoration: none; white-space: nowrap;
  border: 1px solid rgba(125,249,255,0.3);
  backdrop-filter: blur(8px);
  transition: all 0.25s;
}
.geri:hover { background: rgba(125,249,255,0.18); color: #fff; }

.marka {
  display: flex; align-items: center; gap: 9px;
  margin-right: auto;
}
.marka-ikon {
  width: 34px; height: 34px; flex: none;
  border-radius: 11px;
  display: grid; place-items: center;
  font-size: 1.1rem;
  background: linear-gradient(135deg, rgba(180,78,255,0.28), rgba(125,249,255,0.18));
  border: 1px solid rgba(180,78,255,0.4);
  box-shadow: 0 0 18px rgba(180,78,255,0.25);
}
.marka-ad {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.95rem; font-weight: 900; letter-spacing: 0.06em;
  background: linear-gradient(90deg, var(--mavi), var(--mor), var(--pembe));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.1;
}
.marka-alt {
  font-size: 0.6rem; color: #7d7396; letter-spacing: 0.06em;
}

.temizle {
  flex: none;
  background: none; border: 1px solid rgba(255,255,255,0.14);
  color: #8b81a6; cursor: pointer;
  width: 34px; height: 34px; border-radius: 10px;
  font-size: 0.95rem; line-height: 1;
  transition: all 0.25s;
}
.temizle:hover { border-color: rgba(255,79,138,0.5); color: var(--pembe); }

/* Sohbet alanı */
.akis {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  padding: 4px 2px 14px;
  scrollbar-width: thin;
  scrollbar-color: rgba(180,78,255,0.4) transparent;
}
.akis::-webkit-scrollbar { width: 7px; }
.akis::-webkit-scrollbar-thumb {
  background: rgba(180,78,255,0.4); border-radius: 4px;
}

/* Karşılama */
.karsilama { padding: 18px 4px 6px; animation: gir 0.5s ease both; }
.karsilama h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.35rem; font-weight: 900; letter-spacing: 0.02em;
  margin-bottom: 8px; line-height: 1.3;
}
.karsilama p { color: #a79cc4; font-size: 0.94rem; line-height: 1.6; margin-bottom: 16px; }

.oneriler { display: flex; flex-wrap: wrap; gap: 8px; }
.oneri {
  background: rgba(180,78,255,0.09);
  border: 1px solid rgba(180,78,255,0.26);
  color: #d8cff0;
  padding: 9px 14px; border-radius: 20px;
  font-family: inherit; font-size: 0.84rem;
  cursor: pointer; text-align: left;
  transition: all 0.22s;
}
.oneri:hover {
  background: rgba(180,78,255,0.2);
  border-color: rgba(180,78,255,0.55);
  color: #fff; transform: translateY(-2px);
}

/* Mesajlar */
.mesaj { display: flex; gap: 10px; margin-bottom: 16px; animation: gir 0.35s ease both; }
@keyframes gir { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.avatar {
  width: 30px; height: 30px; flex: none;
  border-radius: 9px; display: grid; place-items: center;
  font-size: 0.85rem;
}
.mesaj.ben .avatar {
  background: rgba(125,249,255,0.14);
  border: 1px solid rgba(125,249,255,0.35);
}
.mesaj.bot .avatar {
  background: linear-gradient(135deg, rgba(180,78,255,0.3), rgba(255,79,138,0.2));
  border: 1px solid rgba(180,78,255,0.45);
}

.balon {
  flex: 1 1 auto; min-width: 0;
  padding: 11px 15px; border-radius: 14px;
  font-size: 0.95rem; line-height: 1.68;
  overflow-wrap: break-word;
}
.mesaj.ben .balon {
  background: rgba(125,249,255,0.08);
  border: 1px solid rgba(125,249,255,0.18);
}
.mesaj.bot .balon {
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.08);
}
.mesaj.hata .balon {
  background: rgba(255,79,138,0.1);
  border: 1px solid rgba(255,79,138,0.32);
  color: #ffb3cc;
}

.balon p { margin: 0 0 0.65em; }
.balon p:last-child { margin-bottom: 0; }
.balon strong { color: #fff; }
.balon code {
  background: rgba(125,249,255,0.12);
  color: var(--mavi);
  padding: 1px 6px; border-radius: 5px;
  font-size: 0.88em; font-family: ui-monospace, monospace;
}
.balon ul { margin: 0 0 0.65em; padding-left: 1.25em; }
.balon li { margin-bottom: 0.25em; }

/* Üretilen görsel */
.gorsel-kutu { margin-top: 8px; }
.gorsel-kutu img {
  display: block; width: 100%; max-width: 420px;
  border-radius: 12px;
  border: 1px solid rgba(180,78,255,0.3);
  background: rgba(255,255,255,0.03);
}
.gorsel-indir {
  display: inline-block; margin-top: 8px;
  font-size: 0.78rem; color: var(--mavi); text-decoration: none;
  border-bottom: 1px dashed rgba(125,249,255,0.5);
}

/* Yazıyor animasyonu */
.imlec {
  display: inline-block;
  width: 8px; height: 15px;
  background: var(--mor);
  vertical-align: -2px; margin-left: 2px;
  animation: yanip 0.9s steps(2) infinite;
}
@keyframes yanip { 0%,50% { opacity: 1; } 50.1%,100% { opacity: 0; } }

.noktalar span {
  display: inline-block; width: 7px; height: 7px;
  margin-right: 4px; border-radius: 50%;
  background: var(--mor);
  animation: zipla 1.1s ease-in-out infinite;
}
.noktalar span:nth-child(2) { animation-delay: 0.16s; background: var(--pembe); }
.noktalar span:nth-child(3) { animation-delay: 0.32s; background: var(--mavi); }
@keyframes zipla {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* Alt giriş */
.alt {
  flex: none;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
}

.modlar { display: flex; gap: 7px; margin-bottom: 8px; }
.mod {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  color: #8b81a6;
  padding: 6px 13px; border-radius: 16px;
  font-family: inherit; font-size: 0.78rem; font-weight: 700;
  cursor: pointer; transition: all 0.22s;
}
.mod.acik {
  background: rgba(180,78,255,0.2);
  border-color: rgba(180,78,255,0.55);
  color: #fff;
}

.kutu {
  display: flex; align-items: flex-end; gap: 8px;
  background: rgba(10,8,24,0.85);
  border: 1px solid rgba(180,78,255,0.3);
  border-radius: 18px;
  padding: 7px 7px 7px 15px;
  backdrop-filter: blur(10px);
  transition: border-color 0.25s;
}
.kutu:focus-within { border-color: rgba(180,78,255,0.7); }

#girdi {
  flex: 1 1 auto; min-width: 0;
  background: none; border: none; outline: none; resize: none;
  color: #e8e0f0; font-family: inherit;
  font-size: 1rem;               /* 16px altı iOS'ta sayfayı zoomlar */
  line-height: 1.5;
  max-height: 140px; padding: 6px 0;
}
#girdi::placeholder { color: #6b6284; }

.gonder {
  flex: none;
  width: 40px; height: 40px; border-radius: 13px;
  border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--mor), var(--pembe));
  color: #fff; font-size: 1.05rem; line-height: 1;
  display: grid; place-items: center;
  transition: all 0.22s;
}
.gonder:hover:not(:disabled) {
  transform: scale(1.07);
  box-shadow: 0 0 20px rgba(180,78,255,0.55);
}
.gonder:disabled { opacity: 0.35; cursor: not-allowed; }

.uyari {
  text-align: center; color: #5f5878;
  font-size: 0.68rem; margin-top: 7px; line-height: 1.4;
}

@media (max-width: 560px) {
  .sayfa { padding: 0 10px; }
  .marka-alt { display: none; }
  .karsilama h1 { font-size: 1.15rem; }
  .balon { font-size: 0.92rem; padding: 10px 13px; }
  .oneri { font-size: 0.8rem; padding: 8px 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .mesaj, .karsilama { animation: none; }
  .noktalar span { animation: none; opacity: 0.7; }
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div class="nebula"></div>

<div class="sayfa">

  <header class="ust">
    <a class="geri" href="../">← ANA SAYFA</a>
    <div class="marka">
      <div class="marka-ikon">🛰️</div>
      <div>
        <div class="marka-ad">UZAYGPT</div>
        <div class="marka-alt">merak ettiğin her şeyi sor</div>
      </div>
    </div>
    <button class="temizle" id="temizleBtn" type="button" title="Sohbeti temizle" aria-label="Sohbeti temizle">🗑</button>
  </header>

  <main class="akis" id="akis" aria-live="polite">
    <div class="karsilama" id="karsilama">
      <h1>Selam! Ben UzayGPT 👋</h1>
      <p>Uzay, gezegenler, hayvanlar, ödevin, oyunlar… aklına takılan her şeyi sorabilirsin. İstersen sana bir de görsel çizerim.</p>
      <div class="oneriler" id="oneriler">
        <button class="oneri" type="button">Pulsar nedir?</button>
        <button class="oneri" type="button">Satürn'ün halkaları neden var?</button>
        <button class="oneri" type="button">Kara delik görseli çiz</button>
        <button class="oneri" type="button">Neden gökyüzü mavi?</button>
        <button class="oneri" type="button">Mars'ta yaşayabilir miyiz?</button>
      </div>
    </div>
  </main>

  <div class="alt">
    <div class="modlar">
      <button class="mod acik" type="button" data-mod="sohbet">💬 Soru sor</button>
      <button class="mod" type="button" data-mod="gorsel">🎨 Görsel çiz</button>
    </div>
    <form class="kutu" id="form">
      <textarea id="girdi" rows="1" placeholder="Bir şey sor…"
                autocomplete="off" spellcheck="false" maxlength="2000"
                aria-label="Sorunu yaz"></textarea>
      <button class="gonder" id="gonderBtn" type="submit" aria-label="Gönder">➤</button>
    </form>
    <p class="uyari">UzayGPT yapay zekâdır, bazen yanılabilir. Uzay Coin veremez.</p>
  </div>

</div>

<script>
// ─────────────────────────────────────────────────────────────────────────
// AYAR: Cloudflare Worker adresi.
// Kurulumdan sonra buraya kendi Worker adresini yapıştır.
// Adım adım anlatım: uzaygpt/KURULUM.md
// Örnek: 'https://uzaygpt.kullaniciadin.workers.dev'
const API = 'https://uzaygpt.DEGISTIR.workers.dev';
// ─────────────────────────────────────────────────────────────────────────

// UZAY COIN NOTU: bu sayfa bilerek window.UzayHesap.odul() ÇAĞIRMAZ.
// hesap.js sadece sağ üstteki rozet (nickname + coin) görünsün diye yükleniyor.
// UzayGPT'den coin kazanılmaz — sohbetle coin üretilememesinin tek garantisi
// budur, modelin ne söylediğinden bağımsızdır.

const akis      = document.getElementById('akis');
const form      = document.getElementById('form');
const girdi     = document.getElementById('girdi');
const gonderBtn = document.getElementById('gonderBtn');
const karsilama = document.getElementById('karsilama');

let gecmis  = [];        // [{role, content}] — sunucuya gönderilen sohbet
let mod     = 'sohbet';
let mesgul  = false;

// ─── Yardımcılar ───

function kacir(s) {
  return s.replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// Çok küçük bir markdown: **kalın**, `kod`, - liste, paragraf.
// Önce HTML kaçırılıyor, sonra biçim ekleniyor — dışarıdan etiket giremez.
function bicimle(metin) {
  const satirlar = kacir(metin).split('\n');
  let html = '', listede = false;

  const ici = s => s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');

  for (const ham of satirlar) {
    const s = ham.trim();
    const liste = /^[-*•]\s+/.test(s);

    if (liste) {
      if (!listede) { html += '<ul>'; listede = true; }
      html += '<li>' + ici(s.replace(/^[-*•]\s+/, '')) + '</li>';
      continue;
    }
    if (listede) { html += '</ul>'; listede = false; }
    if (s) html += '<p>' + ici(s) + '</p>';
  }
  if (listede) html += '</ul>';
  return html || '<p></p>';
}

function enAlta() {
  akis.scrollTop = akis.scrollHeight;
}

function karsilamayiGizle() {
  if (karsilama && karsilama.parentNode) karsilama.remove();
}

// Yeni bir mesaj balonu oluşturur, balon elemanını döndürür.
function balonEkle(tur, html) {
  const kim = tur === 'ben' ? 'ben' : (tur === 'hata' ? 'hata' : 'bot');
  const ikon = tur === 'ben' ? '🧑' : (tur === 'hata' ? '⚠️' : '🛰️');

  const satir = document.createElement('div');
  satir.className = 'mesaj ' + kim;

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = ikon;

  const balon = document.createElement('div');
  balon.className = 'balon';
  balon.innerHTML = html;

  satir.append(av, balon);
  akis.appendChild(satir);
  enAlta();
  return balon;
}

function kilitle(durum) {
  mesgul = durum;
  gonderBtn.disabled = durum;
  girdi.disabled = durum;
}

function ayarUyarisi() {
  balonEkle('hata',
    '<p>UzayGPT henüz bağlanmadı. <code>uzaygpt/index.html</code> içindeki ' +
    '<code>API</code> satırına Cloudflare Worker adresi yazılmalı.</p>' +
    '<p>Kurulum: <code>uzaygpt/KURULUM.md</code></p>');
}

// ─── Sohbet (akıtarak) ───

async function sohbetGonder(soru) {
  gecmis.push({ role: 'user', content: soru });

  const balon = balonEkle('bot',
    '<p class="noktalar"><span></span><span></span><span></span></p>');

  let cevap = '';

  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mod: 'sohbet', mesajlar: gecmis }),
    });

    if (!r.ok) {
      let m = 'Şu an cevap veremiyorum. Birazdan tekrar dener misin?';
      try { const j = await r.json(); if (j.hata) m = j.hata; } catch {}
      throw new Error(m);
    }

    // Anthropic SSE akışı: satır satır gelen "data: {...}" parçaları.
    const okuyucu = r.body.getReader();
    const cozucu  = new TextDecoder();
    let tampon = '';

    for (;;) {
      const { done, value } = await okuyucu.read();
      if (done) break;

      tampon += cozucu.decode(value, { stream: true });
      const satirlar = tampon.split('\n');
      tampon = satirlar.pop() || '';   // yarım kalan son satır beklesin

      for (const satir of satirlar) {
        if (!satir.startsWith('data:')) continue;
        const ham = satir.slice(5).trim();
        if (!ham || ham === '[DONE]') continue;

        let olay;
        try { olay = JSON.parse(ham); } catch { continue; }

        if (olay.type === 'content_block_delta' && olay.delta?.type === 'text_delta') {
          cevap += olay.delta.text;
          balon.innerHTML = bicimle(cevap) + '<span class="imlec"></span>';
          enAlta();
        } else if (olay.type === 'error') {
          throw new Error('Cevap yarıda kesildi.');
        }
      }
    }

    if (!cevap.trim()) throw new Error('Boş bir cevap geldi, tekrar dener misin?');

    balon.innerHTML = bicimle(cevap);
    gecmis.push({ role: 'assistant', content: cevap });

    // Geçmişi sınırla — hem maliyet hem hız için.
    if (gecmis.length > 16) gecmis = gecmis.slice(-16);

  } catch (e) {
    // Yarım gelen cevabı silmek yerine hatayı ayrı balonda göster.
    if (cevap.trim()) {
      balon.innerHTML = bicimle(cevap);
      gecmis.push({ role: 'assistant', content: cevap });
    } else {
      balon.parentNode.remove();
    }
    balonEkle('hata', '<p>' + kacir(e.message || 'Bir şeyler ters gitti.') + '</p>');
  } finally {
    enAlta();
  }
}

// ─── Görsel ───

async function gorselGonder(istek) {
  const balon = balonEkle('bot',
    '<p>Çiziyorum…</p><p class="noktalar"><span></span><span></span><span></span></p>');

  try {
    // 1) İsteği İngilizce bir çizim tarifine çevir (Worker üzerinden).
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mod: 'gorsel', istek }),
    });

    const j = await r.json();
    if (!r.ok || !j.prompt) throw new Error(j.hata || 'Görsel hazırlanamadı.');

    // 2) Görseli ücretsiz Pollinations servisinden çek.
    const url = 'https://image.pollinations.ai/prompt/'
      + encodeURIComponent(j.prompt)
      + '?width=768&height=768&nologo=true&seed=' + Math.floor(Math.random() * 1e6);

    await new Promise((tamam, hata) => {
      const im = new Image();
      im.onload  = tamam;
      im.onerror = () => hata(new Error('Görsel yüklenemedi, tekrar dener misin?'));
      im.src = url;
    });

    balon.innerHTML =
      '<p>İşte <strong>' + kacir(istek) + '</strong> 🎨</p>' +
      '<div class="gorsel-kutu">' +
        '<img src="' + kacir(url) + '" alt="' + kacir(istek) + '" loading="lazy">' +
        '<a class="gorsel-indir" href="' + kacir(url) + '" target="_blank" rel="noopener">' +
          'Büyük hâlini aç ↗</a>' +
      '</div>';

  } catch (e) {
    balon.parentNode.remove();
    balonEkle('hata', '<p>' + kacir(e.message || 'Görsel çizilemedi.') + '</p>');
  } finally {
    enAlta();
  }
}

// ─── Gönderme ───

async function gonder(metin) {
  const soru = (metin || '').trim();
  if (!soru || mesgul) return;

  if (API.includes('DEGISTIR')) { karsilamayiGizle(); ayarUyarisi(); return; }

  karsilamayiGizle();
  balonEkle('ben', bicimle(soru));

  girdi.value = '';
  girdi.style.height = 'auto';
  kilitle(true);

  if (mod === 'gorsel') await gorselGonder(soru);
  else                  await sohbetGonder(soru);

  kilitle(false);
  if (matchMedia('(min-width: 700px)').matches) girdi.focus();
}

form.addEventListener('submit', e => {
  e.preventDefault();
  gonder(girdi.value);
});

// Enter gönderir, Shift+Enter alt satır. Mobilde Enter her zaman alt satır.
girdi.addEventListener('keydown', e => {
  const mobil = matchMedia('(max-width: 700px)').matches;
  if (e.key === 'Enter' && !e.shiftKey && !mobil) {
    e.preventDefault();
    gonder(girdi.value);
  }
});

// Yazdıkça kutu büyüsün
girdi.addEventListener('input', () => {
  girdi.style.height = 'auto';
  girdi.style.height = Math.min(girdi.scrollHeight, 140) + 'px';
});

// Öneri düğmeleri
document.getElementById('oneriler').addEventListener('click', e => {
  const b = e.target.closest('.oneri');
  if (!b) return;
  const t = b.textContent.trim();
  // "… görseli çiz" yazan öneri otomatik görsel moduna geçsin
  if (/görsel|çiz/i.test(t)) modDegistir('gorsel');
  gonder(t);
});

// Mod düğmeleri
function modDegistir(yeni) {
  mod = yeni;
  document.querySelectorAll('.mod').forEach(b =>
    b.classList.toggle('acik', b.dataset.mod === yeni));
  girdi.placeholder = yeni === 'gorsel'
    ? 'Ne çizeyim? (örn: halkalı bir gezegen)'
    : 'Bir şey sor…';
}

document.querySelectorAll('.mod').forEach(b =>
  b.addEventListener('click', () => modDegistir(b.dataset.mod)));

// Temizle
document.getElementById('temizleBtn').addEventListener('click', () => {
  if (mesgul) return;
  gecmis = [];
  akis.innerHTML = '';
  akis.appendChild(karsilama);
  girdi.focus();
});

// ─── Yıldız alanı ───
(function () {
  const c = document.getElementById('starfield');
  const x = c.getContext('2d');
  let yildizlar = [];

  function kur() {
    c.width  = innerWidth;
    c.height = innerHeight;
    const adet = Math.min(140, Math.round(innerWidth * innerHeight / 9000));
    yildizlar = Array.from({ length: adet }, () => ({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: Math.random() * 1.3 + 0.3,
      p: Math.random() * Math.PI * 2,
      h: Math.random() * 0.02 + 0.006,
    }));
  }

  function ciz() {
    x.clearRect(0, 0, c.width, c.height);
    for (const s of yildizlar) {
      s.p += s.h;
      x.globalAlpha = 0.3 + Math.abs(Math.sin(s.p)) * 0.7;
      x.fillStyle = '#cfd9ff';
      x.beginPath();
      x.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      x.fill();
    }
    x.globalAlpha = 1;
    requestAnimationFrame(ciz);
  }

  kur();
  addEventListener('resize', kur);
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) ciz();
  else { x.globalAlpha = 0.7; yildizlar.forEach(s => {
    x.fillStyle = '#cfd9ff'; x.beginPath(); x.arc(s.x, s.y, s.r, 0, Math.PI*2); x.fill();
  }); }
})();
</script>
