<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kule Yığını</title>
<link rel="icon" href="../logo/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../logo/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../logo/favicon-16.png">
<link rel="icon" type="image/svg+xml" href="../logo/favicon.svg">
<link rel="apple-touch-icon" href="../logo/apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; touch-action: manipulation; }
  body {
    background: linear-gradient(180deg, #1a2230 0%, #2e3d4f 45%, #6b5a48 80%, #8a7257 100%);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
  }
  #canvas { display: block; width: 100%; height: 100%; cursor: pointer; position: fixed; top: 0; left: 0; }

  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    pointer-events: none;
    z-index: 10;
    padding: 20px;
    text-align: center;
  }

  .score {
    font-size: 5rem;
    font-weight: 900;
    text-shadow: 0 4px 24px rgba(0,0,0,0.55), 0 0 35px rgba(125, 249, 255, 0.35);
    letter-spacing: 0.03em;
    color: #fff;
    margin-top: 70px;
    line-height: 1;
    display: inline-block;
  }
  .score.pulse { animation: scorePulse 0.35s ease; }
  @keyframes scorePulse {
    0%   { transform: scale(1); color: #fff; }
    45%  { transform: scale(1.18); color: #7df9ff; }
    100% { transform: scale(1); color: #fff; }
  }

  .combo {
    font-size: 1.15rem;
    font-weight: 800;
    margin-top: 10px;
    color: #ffeb3b;
    text-shadow: 0 0 14px rgba(255, 235, 59, 0.75);
    letter-spacing: 0.1em;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.25s, transform 0.25s;
  }
  .combo.show { opacity: 1; transform: translateY(0); }

  .start-screen, .game-over {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,10,42,0.94) 0%, rgba(26,16,64,0.94) 60%, rgba(42,24,88,0.94) 100%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .start-screen.hidden, .game-over.hidden { display: none; }

  .title {
    font-size: 4rem;
    font-weight: 900;
    background: linear-gradient(135deg, #7df9ff, #ff7df9, #7df9ff);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleShimmer 3.5s ease infinite;
    margin-bottom: 18px;
    letter-spacing: 0.06em;
  }
  @keyframes titleShimmer {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .subtitle {
    font-size: 1.05rem;
    color: #b6c8ee;
    margin-bottom: 36px;
    max-width: 380px;
    line-height: 1.55;
  }

  .btn {
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #4a8bff, #7d4aff);
    border: none;
    border-radius: 60px;
    padding: 16px 52px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 32px rgba(77, 75, 255, 0.55);
    letter-spacing: 0.1em;
  }
  .btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 14px 42px rgba(125, 100, 255, 0.75); }
  .btn:active { transform: scale(0.97); }

  .diff-label {
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.3em;
    color: #8aa3d0;
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  .diff-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 36px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .diff-pick {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: #aab8d8;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 40px;
    padding: 11px 26px;
    cursor: pointer;
    transition: color 0.25s, border-color 0.25s, background 0.25s, transform 0.2s, box-shadow 0.25s;
    text-transform: uppercase;
  }
  .diff-pick:hover { color: #fff; border-color: rgba(255,255,255,0.35); transform: translateY(-1px); }

  .diff-pick.active {
    color: #050518;
    border-color: transparent;
    transform: translateY(-1px);
  }
  .diff-pick.active[data-diff="kolay"] { background: linear-gradient(135deg, #00ff9d, #00c8ff); box-shadow: 0 6px 24px rgba(0,255,157,0.4); }
  .diff-pick.active[data-diff="orta"]  { background: linear-gradient(135deg, #ffaa00, #ff6b35); box-shadow: 0 6px 24px rgba(255,170,0,0.4); }
  .diff-pick.active[data-diff="zor"]   { background: linear-gradient(135deg, #ff3366, #a855f7); box-shadow: 0 6px 24px rgba(255,51,102,0.4); }

  .final-score {
    font-size: 5rem;
    font-weight: 900;
    color: #7df9ff;
    text-shadow: 0 0 32px rgba(125, 249, 255, 0.65);
    margin: 14px 0 4px;
    line-height: 1;
  }
  .best-score {
    font-size: 0.95rem;
    color: #aac3ee;
    margin-bottom: 32px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .new-best {
    color: #ffeb3b;
    text-shadow: 0 0 14px rgba(255, 235, 59, 0.8);
    margin-bottom: 8px;
    font-weight: 800;
    letter-spacing: 0.16em;
    font-size: 0.95rem;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .new-best.show { opacity: 1; }

  .hint {
    position: fixed;
    bottom: 36px;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.95rem;
    color: rgba(200, 220, 255, 0.65);
    z-index: 10;
    pointer-events: none;
    letter-spacing: 0.2em;
    font-weight: 700;
    animation: hintPulse 1.6s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }
  .hint.hidden { display: none; }

  .diff-tag {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 50;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.2em;
    padding: 6px 14px;
    border-radius: 30px;
    backdrop-filter: blur(0);
  }
  .diff-tag.kolay { background: rgba(0,255,157,0.18); color: #00ff9d; border: 1px solid rgba(0,255,157,0.4); }
  .diff-tag.orta  { background: rgba(255,170,0,0.18); color: #ffaa00; border: 1px solid rgba(255,170,0,0.4); }
  .diff-tag.zor   { background: rgba(255,51,102,0.18); color: #ff3366; border: 1px solid rgba(255,51,102,0.4); }

  @media (max-width: 480px) {
    .score { font-size: 4rem; margin-top: 60px; }
    .title { font-size: 2.8rem; }
    .subtitle { font-size: 0.95rem; }
    .final-score { font-size: 4rem; }
    .btn { font-size: 1.05rem; padding: 14px 40px; }
  }
</style>
<script src="../analytics.js"></script>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="hud">
  <div><span class="score" id="score">0</span></div>
  <div class="combo" id="combo">MÜKEMMEL!</div>
</div>

<div class="hint hidden" id="hint">▶ DOKUN / TIKLA / BOŞLUK</div>

<div class="diff-tag" id="diffTag"></div>

<div class="start-screen" id="startScreen">
  <h1 class="title">KULE YIĞINI</h1>
  <p class="subtitle">Hareket eden blokları üst üste mükemmel hizala. Bir yere dokun ya da tıkla — taşan kısımlar düşüp gider, kuleyi ne kadar yüksek inşa edebilirsin?</p>
  <div class="diff-label">ZORLUK SEÇ</div>
  <div class="diff-selector" id="diffSelector">
    <button class="diff-pick" data-diff="kolay">Kolay</button>
    <button class="diff-pick active" data-diff="orta">Orta</button>
    <button class="diff-pick" data-diff="zor">Zor</button>
  </div>
  <button class="btn" id="startBtn">OYUNA BAŞLA</button>
</div>

<div class="game-over hidden" id="gameOver">
  <h1 class="title" style="font-size: 2.6rem;">OYUN BİTTİ</h1>
  <div class="new-best" id="newBest">★ YENİ REKOR ★</div>
  <div class="final-score" id="finalScore">0</div>
  <div class="best-score" id="bestScore">EN İYİ: 0</div>
  <div class="diff-label">YENİ ZORLUK</div>
  <div class="diff-selector" id="diffSelector2">
    <button class="diff-pick" data-diff="kolay">Kolay</button>
    <button class="diff-pick active" data-diff="orta">Orta</button>
    <button class="diff-pick" data-diff="zor">Zor</button>
  </div>
  <button class="btn" id="restartBtn">TEKRAR OYNA</button>
</div>

<a href="../" style="position:fixed;top:16px;left:16px;z-index:9999;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(0,0,0,0.55);color:#7df9ff;font-family:'Segoe UI',sans-serif;font-size:0.85rem;font-weight:700;border-radius:30px;text-decoration:none;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);transition:background 0.3s,transform 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.8)';this.style.transform='scale(1.05)'" onmouseout="this.style.background='rgba(0,0,0,0.55)';this.style.transform='scale(1)'">&#8592; Ana Sayfa</a>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ─── DOM ───
const canvas        = document.getElementById('canvas');
const scoreEl       = document.getElementById('score');
const comboEl       = document.getElementById('combo');
const hintEl        = document.getElementById('hint');
const startScreen   = document.getElementById('startScreen');
const gameOverScr   = document.getElementById('gameOver');
const finalScoreEl  = document.getElementById('finalScore');
const bestScoreEl   = document.getElementById('bestScore');
const newBestEl     = document.getElementById('newBest');
const startBtn      = document.getElementById('startBtn');
const restartBtn    = document.getElementById('restartBtn');
const diffTagEl     = document.getElementById('diffTag');

// ─── Three.js setup ───
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x2e3d4f, 40, 95);

const camera = new THREE.OrthographicCamera();
const VIEW_SIZE = 26;
function updateCamera() {
  const aspect = window.innerWidth / window.innerHeight;
  camera.left   = -aspect * VIEW_SIZE / 2;
  camera.right  =  aspect * VIEW_SIZE / 2;
  camera.top    =  VIEW_SIZE / 2;
  camera.bottom = -VIEW_SIZE / 2;
  camera.near   = 1;
  camera.far    = 200;
  camera.updateProjectionMatrix();
}
updateCamera();
camera.position.set(22, 22, 22);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Lights — neutral daylight so brick/concrete read naturally
scene.add(new THREE.AmbientLight(0xc4c0b4, 0.62));

const dirLight = new THREE.DirectionalLight(0xfff4e0, 1.2);
dirLight.position.set(18, 38, 14);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width  = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.left   = -22;
dirLight.shadow.camera.right  =  22;
dirLight.shadow.camera.top    =  60;
dirLight.shadow.camera.bottom = -22;
dirLight.shadow.camera.near = 1;
dirLight.shadow.camera.far  = 120;
scene.add(dirLight);

const rimLight = new THREE.DirectionalLight(0x6688aa, 0.45);
rimLight.position.set(-12, 8, -10);
scene.add(rimLight);

// ─── Difficulty presets ───
const DIFFICULTY_PRESETS = {
  kolay: { initSize: 7.5, speedStart: 0.06, speedMax: 0.20, speedInc: 0.0030, label: 'KOLAY' },
  orta:  { initSize: 6.0, speedStart: 0.09, speedMax: 0.30, speedInc: 0.0045, label: 'ORTA'  },
  zor:   { initSize: 5.0, speedStart: 0.13, speedMax: 0.38, speedInc: 0.0065, label: 'ZOR'   }
};

let currentDiffKey = localStorage.getItem('kuleYiginiDiff') || 'orta';
if (!DIFFICULTY_PRESETS[currentDiffKey]) currentDiffKey = 'orta';
let PRESET = DIFFICULTY_PRESETS[currentDiffKey];

// ─── Constants ───
const BLOCK_HEIGHT      = 1.4;
let   INITIAL_SIZE      = PRESET.initSize;
let   SPEED_START       = PRESET.speedStart;
let   SPEED_MAX         = PRESET.speedMax;
let   SPEED_INCREMENT   = PRESET.speedInc;
const SPAWN_DISTANCE    = 13;
const PERFECT_THRESHOLD = 0.18;

function applyDifficulty(key) {
  if (!DIFFICULTY_PRESETS[key]) key = 'orta';
  currentDiffKey = key;
  PRESET = DIFFICULTY_PRESETS[key];
  INITIAL_SIZE    = PRESET.initSize;
  SPEED_START     = PRESET.speedStart;
  SPEED_MAX       = PRESET.speedMax;
  SPEED_INCREMENT = PRESET.speedInc;
  try { localStorage.setItem('kuleYiginiDiff', key); } catch (e) {}
  // Update tag
  diffTagEl.className = 'diff-tag ' + key;
  diffTagEl.textContent = PRESET.label;
  // Sync both selectors
  document.querySelectorAll('.diff-pick').forEach(b => {
    b.classList.toggle('active', b.dataset.diff === key);
  });
}

// ─── State ───
let blocks = [];        // stable tower (foundation + landed)
let fallingBlocks = []; // animated falling chunks
let currentBlock = null;
let score = 0;
let bestScore = parseInt(localStorage.getItem('kuleYiginiBest') || '0', 10);
let running = false;
let camYTarget = 0;
let camYCurrent = 0;
let perfectCombo = 0;
let cameraShake = 0;

// ─── Audio (Web Audio API) ───
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, type = 'sine', volume = 0.12) {
  const ctx = ensureAudio();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration + 0.02);
  } catch (e) {}
}
function soundDrop() {
  const base = 280 + Math.min(700, blocks.length * 22);
  playTone(base, 0.10, 'square', 0.08);
}
function soundPerfect(combo) {
  const base = 760 + combo * 60;
  playTone(base, 0.13, 'sine', 0.14);
  setTimeout(() => playTone(base * 1.5, 0.18, 'sine', 0.13), 70);
}
function soundCut() {
  playTone(180, 0.22, 'sawtooth', 0.07);
}
function soundGameOver() {
  playTone(260, 0.28, 'triangle', 0.13);
  setTimeout(() => playTone(200, 0.30, 'triangle', 0.13), 160);
  setTimeout(() => playTone(150, 0.55, 'triangle', 0.13), 340);
}

// ─── Procedural construction textures (brick & concrete) ───
function createBrickTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  // mortar base
  ctx.fillStyle = '#c9bca9';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) {
    ctx.fillStyle = `rgba(150,138,120,${Math.random() * 0.18})`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  const rows = 6, cols = 3, brickH = 256 / rows, brickW = 256 / cols, mortar = 5;
  for (let r = 0; r < rows; r++) {
    const y = r * brickH;
    const off = (r % 2) ? brickW / 2 : 0;
    for (let ci = -1; ci <= cols; ci++) {
      const x = ci * brickW + off;
      const shade = 150 + Math.random() * 42;            // terracotta variation
      ctx.fillStyle = `rgb(${shade | 0},${shade * 0.40 | 0},${shade * 0.31 | 0})`;
      ctx.fillRect(x + mortar / 2, y + mortar / 2, brickW - mortar, brickH - mortar);
      // top highlight + bottom shadow for relief
      ctx.fillStyle = 'rgba(255,235,210,0.10)';
      ctx.fillRect(x + mortar / 2, y + mortar / 2, brickW - mortar, 3);
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      ctx.fillRect(x + mortar / 2, y + brickH - mortar - 3, brickW - mortar, 3);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

function createConcreteTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#9c9b93';
  ctx.fillRect(0, 0, 256, 256);
  // speckled grain
  for (let i = 0; i < 11000; i++) {
    const g = 156 + (Math.random() - 0.5) * 46;
    ctx.fillStyle = `rgba(${g | 0},${g | 0},${(g - 6) | 0},${Math.random() * 0.5})`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  // hairline cracks
  ctx.strokeStyle = 'rgba(60,60,56,0.22)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    let x = Math.random() * 256, y = Math.random() * 256;
    ctx.moveTo(x, y);
    for (let s = 0; s < 5; s++) { x += (Math.random() - 0.5) * 60; y += (Math.random() - 0.5) * 60; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  // form-panel seams
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  ctx.fillRect(0, 127, 256, 2);
  ctx.fillRect(127, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

function finishTexture(c) {
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

// Cinder / breeze block — gray block with two hollow cores
function createCinderTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#7f8079';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 7000; i++) {
    const g = 124 + (Math.random() - 0.5) * 40;
    ctx.fillStyle = `rgba(${g | 0},${g | 0},${(g - 4) | 0},${Math.random() * 0.5})`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  ctx.strokeStyle = 'rgba(40,40,38,0.55)';
  ctx.lineWidth = 4;
  for (let r = 0; r < 2; r++) {
    const y = r * 128;
    ctx.strokeRect(8, y + 8, 240, 112);
    // two hollow cores per block
    ctx.fillStyle = 'rgba(35,35,33,0.45)';
    ctx.fillRect(34, y + 30, 80, 68);
    ctx.fillRect(142, y + 30, 80, 68);
    ctx.strokeStyle = 'rgba(20,20,18,0.6)';
    ctx.lineWidth = 3;
    ctx.strokeRect(34, y + 30, 80, 68);
    ctx.strokeRect(142, y + 30, 80, 68);
    ctx.strokeStyle = 'rgba(40,40,38,0.55)';
    ctx.lineWidth = 4;
  }
  return finishTexture(c);
}

// Wooden construction planks
function createWoodTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const planks = 4, pw = 256 / planks;
  for (let p = 0; p < planks; p++) {
    const base = 120 + Math.random() * 35;
    ctx.fillStyle = `rgb(${base | 0},${base * 0.66 | 0},${base * 0.40 | 0})`;
    ctx.fillRect(p * pw, 0, pw, 256);
    // grain lines
    for (let g = 0; g < 22; g++) {
      ctx.strokeStyle = `rgba(${base * 0.55 | 0},${base * 0.38 | 0},${base * 0.22 | 0},${0.18 + Math.random() * 0.2})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      const gx = p * pw + Math.random() * pw;
      ctx.moveTo(gx, 0);
      ctx.bezierCurveTo(gx + (Math.random() - 0.5) * 8, 85, gx + (Math.random() - 0.5) * 8, 170, gx + (Math.random() - 0.5) * 8, 256);
      ctx.stroke();
    }
    // plank gap shadow
    ctx.fillStyle = 'rgba(0,0,0,0.30)';
    ctx.fillRect(p * pw, 0, 2, 256);
    ctx.fillStyle = 'rgba(255,235,200,0.06)';
    ctx.fillRect(p * pw + 2, 0, 2, 256);
  }
  return finishTexture(c);
}

// Hazard tape — diagonal yellow/black stripes (steel beams / barriers)
function createHazardTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f2c200';
  ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#1a1a1a';
  const sw = 36;
  ctx.save();
  for (let i = -8; i < 16; i++) {
    ctx.beginPath();
    ctx.moveTo(i * sw, 0);
    ctx.lineTo(i * sw + sw, 0);
    ctx.lineTo(i * sw + sw - 256, 256);
    ctx.lineTo(i * sw - 256, 256);
    ctx.closePath();
    if (i % 2 === 0) ctx.fill();
  }
  ctx.restore();
  // subtle wear
  for (let i = 0; i < 2500; i++) {
    ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.12})`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  return finishTexture(c);
}

// Cut stone / ashlar masonry
function createStoneTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#5e6166';
  ctx.fillRect(0, 0, 256, 256);
  const rows = 4, rowH = 256 / rows;
  for (let r = 0; r < rows; r++) {
    const y = r * rowH;
    const n = 2 + Math.floor(Math.random() * 2);
    let x = -Math.random() * 40;
    for (let i = 0; i <= n; i++) {
      const w = 256 / n + (Math.random() - 0.5) * 40;
      const s = 92 + Math.random() * 40;
      ctx.fillStyle = `rgb(${s | 0},${(s + 4) | 0},${(s + 8) | 0})`;
      ctx.fillRect(x + 3, y + 3, w - 6, rowH - 6);
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fillRect(x + 3, y + 3, w - 6, 3);
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.fillRect(x + 3, y + rowH - 6, w - 6, 3);
      x += w;
    }
  }
  return finishTexture(c);
}

// Glazed checker tile
function createTileTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const n = 4, t = 256 / n;
  for (let yi = 0; yi < n; yi++) {
    for (let xi = 0; xi < n; xi++) {
      const dark = (xi + yi) % 2 === 0;
      ctx.fillStyle = dark ? '#1f6f78' : '#e9f3f0';
      ctx.fillRect(xi * t, yi * t, t, t);
      // grout
      ctx.strokeStyle = 'rgba(60,70,72,0.5)';
      ctx.lineWidth = 3;
      ctx.strokeRect(xi * t, yi * t, t, t);
      // glossy highlight
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(xi * t + 5, yi * t + 5, t - 10, 6);
    }
  }
  return finishTexture(c);
}

// Build the deck of block styles once; tower cycles through them for variety.
const TEXTURE_SET = [
  { tex: createBrickTexture(),    rough: 0.88, metal: 0.0 },
  { tex: createConcreteTexture(), rough: 0.94, metal: 0.0 },
  { tex: createCinderTexture(),   rough: 0.92, metal: 0.0 },
  { tex: createWoodTexture(),     rough: 0.80, metal: 0.0 },
  { tex: createHazardTexture(),   rough: 0.55, metal: 0.15 },
  { tex: createStoneTexture(),    rough: 0.85, metal: 0.05 },
  { tex: createTileTexture(),     rough: 0.35, metal: 0.10 }
];

// Each layer gets a different patterned style, cycling down the tower.
function makeMaterial(index) {
  const style = TEXTURE_SET[index % TEXTURE_SET.length];
  const tex = style.tex.clone();
  tex.needsUpdate = true;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.offset.set(Math.random(), Math.random());
  return new THREE.MeshStandardMaterial({
    map: tex,
    roughness: style.rough,
    metalness: style.metal
  });
}

// ─── Blocks ───
function addBlock(x, y, z, sizeX, sizeZ, axis, moving) {
  const geo = new THREE.BoxGeometry(sizeX, BLOCK_HEIGHT, sizeZ);
  const mat = makeMaterial(blocks.length);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  const speed = SPEED_START + Math.min(SPEED_MAX - SPEED_START, blocks.length * SPEED_INCREMENT);
  const block = { mesh, sizeX, sizeZ, axis, moving, direction: blocks.length % 2 === 0 ? 1 : -1, speed };
  blocks.push(block);
  return block;
}

function addFallingChunk(x, y, z, sizeX, sizeZ, vx, vz, srcMat) {
  const geo = new THREE.BoxGeometry(sizeX, BLOCK_HEIGHT, sizeZ);
  const mat = srcMat.clone();
  mat.map = srcMat.map.clone();
  mat.map.needsUpdate = true;
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  scene.add(mesh);
  fallingBlocks.push({
    mesh,
    vy: 0.05,
    vx,
    vz,
    rotX: (Math.random() - 0.5) * 0.08,
    rotZ: (Math.random() - 0.5) * 0.08,
    life: 2.5
  });
}

function disposeMesh(mesh) {
  scene.remove(mesh);
  if (mesh.geometry) mesh.geometry.dispose();
  if (mesh.material) mesh.material.dispose();
}

// ─── Game lifecycle ───
function initGame() {
  for (const b of blocks)        disposeMesh(b.mesh);
  for (const f of fallingBlocks) disposeMesh(f.mesh);
  blocks = [];
  fallingBlocks = [];
  score = 0;
  perfectCombo = 0;
  camYTarget = 0;
  camYCurrent = 0;
  cameraShake = 0;
  currentBlock = null;

  // Foundation
  addBlock(0, 0, 0, INITIAL_SIZE, INITIAL_SIZE, null, false);
  spawnNextBlock();

  updateScore();
}

function spawnNextBlock() {
  const prev = blocks[blocks.length - 1];
  const axis = (blocks.length % 2 === 1) ? 'x' : 'z';
  let x = prev.mesh.position.x;
  let z = prev.mesh.position.z;
  if (axis === 'x') x -= SPAWN_DISTANCE;
  else              z -= SPAWN_DISTANCE;
  const y = prev.mesh.position.y + BLOCK_HEIGHT;
  currentBlock = addBlock(x, y, z, prev.sizeX, prev.sizeZ, axis, true);
  currentBlock.direction = 1;
  camYTarget = Math.max(0, (blocks.length - 4) * BLOCK_HEIGHT);
}

function dropBlock() {
  if (!running || !currentBlock || !currentBlock.moving) return;

  const cur  = currentBlock;
  const prev = blocks[blocks.length - 2];
  cur.moving = false;

  const axis     = cur.axis;
  const curPos   = axis === 'x' ? cur.mesh.position.x  : cur.mesh.position.z;
  const prevPos  = axis === 'x' ? prev.mesh.position.x : prev.mesh.position.z;
  const curSize  = axis === 'x' ? cur.sizeX            : cur.sizeZ;
  const prevSize = axis === 'x' ? prev.sizeX           : prev.sizeZ;

  const delta    = curPos - prevPos;
  const absDelta = Math.abs(delta);
  const overlap  = Math.min(curSize, prevSize) - absDelta;

  // No overlap → game over
  if (overlap <= 0) {
    fallingBlocks.push({
      mesh: cur.mesh,
      vy: 0,
      vx: axis === 'x' ? Math.sign(delta) * 0.12 : (Math.random() - 0.5) * 0.05,
      vz: axis === 'z' ? Math.sign(delta) * 0.12 : (Math.random() - 0.5) * 0.05,
      rotX: (Math.random() - 0.5) * 0.1,
      rotZ: (Math.random() - 0.5) * 0.1,
      life: 3
    });
    blocks.pop();
    soundGameOver();
    endGame();
    return;
  }

  const curMat = cur.mesh.material;

  // Perfect placement → snap & bonus
  if (absDelta < PERFECT_THRESHOLD) {
    if (axis === 'x') cur.mesh.position.x = prev.mesh.position.x;
    else              cur.mesh.position.z = prev.mesh.position.z;
    cur.sizeX = prev.sizeX;
    cur.sizeZ = prev.sizeZ;
    perfectCombo++;
    const bonus = 1 + Math.min(5, perfectCombo);
    score += bonus;
    showCombo(perfectCombo > 1 ? `MÜKEMMEL x${perfectCombo}! +${bonus}` : `MÜKEMMEL! +${bonus}`);
    soundPerfect(perfectCombo);
    cameraShake = 0.15;
  } else {
    perfectCombo = 0;
    score += 1;

    // Compute overlap region & chunk
    const curStart   = curPos  - curSize  / 2;
    const curEnd     = curPos  + curSize  / 2;
    const prevStart  = prevPos - prevSize / 2;
    const prevEnd    = prevPos + prevSize / 2;
    const overlapStart = Math.max(curStart, prevStart);
    const overlapEnd   = Math.min(curEnd,   prevEnd);
    const newCenter    = (overlapStart + overlapEnd) / 2;
    const newSize      = overlap;

    // Rebuild trimmed top block (keep its material/texture)
    scene.remove(cur.mesh);
    cur.mesh.geometry.dispose();
    if (axis === 'x') cur.sizeX = newSize;
    else              cur.sizeZ = newSize;

    const geo = new THREE.BoxGeometry(cur.sizeX, BLOCK_HEIGHT, cur.sizeZ);
    cur.mesh = new THREE.Mesh(geo, curMat);
    cur.mesh.castShadow = true;
    cur.mesh.receiveShadow = true;
    if (axis === 'x') {
      cur.mesh.position.set(newCenter, prev.mesh.position.y + BLOCK_HEIGHT, prev.mesh.position.z);
    } else {
      cur.mesh.position.set(prev.mesh.position.x, prev.mesh.position.y + BLOCK_HEIGHT, newCenter);
    }
    scene.add(cur.mesh);

    // Falling chunk
    const chunkSize   = absDelta;
    const chunkCenter = delta > 0 ? overlapEnd + chunkSize / 2 : overlapStart - chunkSize / 2;
    const chunkY      = prev.mesh.position.y + BLOCK_HEIGHT;
    if (axis === 'x') {
      addFallingChunk(chunkCenter, chunkY, prev.mesh.position.z, chunkSize, cur.sizeZ,
                      Math.sign(delta) * 0.08, 0, curMat);
    } else {
      addFallingChunk(prev.mesh.position.x, chunkY, chunkCenter, cur.sizeX, chunkSize,
                      0, Math.sign(delta) * 0.08, curMat);
    }
    soundDrop();
    soundCut();
  }

  updateScore();
  spawnNextBlock();
}

// ─── HUD helpers ───
let comboTimer = null;
function showCombo(text) {
  comboEl.textContent = text;
  comboEl.classList.add('show');
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => comboEl.classList.remove('show'), 900);
}

function updateScore() {
  scoreEl.textContent = score;
  scoreEl.classList.remove('pulse');
  void scoreEl.offsetWidth;
  scoreEl.classList.add('pulse');
}

function endGame() {
  running = false;
  const isNewBest = score > bestScore;
  if (isNewBest) {
    bestScore = score;
    try { localStorage.setItem('kuleYiginiBest', String(bestScore)); } catch (e) {}
  }
  finalScoreEl.textContent = score;
  bestScoreEl.textContent  = `EN İYİ: ${bestScore}`;
  newBestEl.classList.toggle('show', isNewBest);
  setTimeout(() => gameOverScr.classList.remove('hidden'), 900);
}

function startGame() {
  ensureAudio();
  initGame();
  running = true;
  startScreen.classList.add('hidden');
  gameOverScr.classList.add('hidden');
  hintEl.classList.remove('hidden');
  setTimeout(() => hintEl.classList.add('hidden'), 2600);
}

// ─── Loop ───
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, clock.getDelta());

  // Move active block
  if (running && currentBlock && currentBlock.moving) {
    const cb   = currentBlock;
    const prev = blocks[blocks.length - 2];
    const range = SPAWN_DISTANCE - 1;
    if (cb.axis === 'x') {
      cb.mesh.position.x += cb.direction * cb.speed;
      if (cb.mesh.position.x >  prev.mesh.position.x + range) { cb.mesh.position.x =  prev.mesh.position.x + range; cb.direction = -1; }
      if (cb.mesh.position.x <  prev.mesh.position.x - range) { cb.mesh.position.x =  prev.mesh.position.x - range; cb.direction =  1; }
    } else {
      cb.mesh.position.z += cb.direction * cb.speed;
      if (cb.mesh.position.z >  prev.mesh.position.z + range) { cb.mesh.position.z =  prev.mesh.position.z + range; cb.direction = -1; }
      if (cb.mesh.position.z <  prev.mesh.position.z - range) { cb.mesh.position.z =  prev.mesh.position.z - range; cb.direction =  1; }
    }
  }

  // Falling chunks
  for (let i = fallingBlocks.length - 1; i >= 0; i--) {
    const f = fallingBlocks[i];
    f.vy -= 0.04;
    f.mesh.position.y += f.vy;
    f.mesh.position.x += f.vx;
    f.mesh.position.z += f.vz;
    f.mesh.rotation.x += f.rotX;
    f.mesh.rotation.z += f.rotZ;
    f.life -= dt;
    if (f.mesh.position.y < -40 || f.life <= 0) {
      disposeMesh(f.mesh);
      fallingBlocks.splice(i, 1);
    }
  }

  // Camera follow + shake
  camYCurrent += (camYTarget - camYCurrent) * 0.06;
  let shakeX = 0, shakeY = 0;
  if (cameraShake > 0) {
    shakeX = (Math.random() - 0.5) * cameraShake;
    shakeY = (Math.random() - 0.5) * cameraShake;
    cameraShake *= 0.85;
    if (cameraShake < 0.005) cameraShake = 0;
  }
  camera.position.set(22 + shakeX, 22 + camYCurrent + shakeY, 22 + shakeX);
  camera.lookAt(0, camYCurrent, 0);

  renderer.render(scene, camera);
}

// ─── Events ───
function onDrop(e) {
  if (e) e.preventDefault();
  if (running) dropBlock();
}
canvas.addEventListener('click', onDrop);
canvas.addEventListener('touchstart', onDrop, { passive: false });
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); onDrop(); }
});

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

// Difficulty pickers (both start and game-over screens)
document.querySelectorAll('.diff-selector').forEach(sel => {
  sel.addEventListener('click', (e) => {
    const btn = e.target.closest('.diff-pick');
    if (!btn) return;
    applyDifficulty(btn.dataset.diff);
  });
});

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateCamera();
});

// ─── Boot ───
applyDifficulty(currentDiffKey);  // initialize tag + selector state
initGame();                       // build idle tower preview behind start screen
running = false;
loop();
</script>
