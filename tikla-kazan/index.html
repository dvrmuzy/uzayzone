<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tıkla Kazan - Uzay Zone</title>
<!--
  Sesler (hepsi CC0 / Public Domain, opengameart.org):
    click.ogg / levelup.ogg  - "12 Coin Sound Effects" by StarNinjas (CC0)
    music-robux.mp3          - "Happy Adventure (Loop)" by TinyWorlds (CC0)
    music-uzay.ogg           - "ObservingTheStar" (cc0 space music) (CC0)
  İkonlar:
    robux.png     - Robux 2019 logo (Wikimedia Commons)
    minecoin.svg  - Minecoin tarzı altın "M" para (özgün çizim)
-->

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="../analytics.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Nunito', sans-serif;
  background: #05060f;
  color: #fff;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.8s ease;
  background: radial-gradient(ellipse at 50% 30%, #15163a, #05060f 70%);
  overflow: hidden;
}

/* Tema arka planları */
#app.t-robux   { background: radial-gradient(ellipse at 50% 25%, #2a0a0a, #0a0405 75%); }
#app.t-minecoin{ background: radial-gradient(ellipse at 50% 25%, #123018, #06120a 75%); }
#app.t-elmas   { background: radial-gradient(ellipse at 50% 25%, #0a1f4a, #04081e 75%); }
#app.t-uzay    { background: radial-gradient(ellipse at 50% 25%, #2a0a48, #07041a 75%); }

/* ─── Seçim Ekranı ─── */
#selectScreen {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: radial-gradient(ellipse at 50% 30%, #15163a, #05060f 70%);
}

.sel-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: clamp(1.6rem, 6vw, 2.8rem);
  text-align: center;
  letter-spacing: 0.04em;
  background: linear-gradient(90deg, #ffd24a, #ff60c8, #60d4ff);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}

.sel-sub {
  font-size: clamp(0.95rem, 3.4vw, 1.2rem);
  color: #b9b6d8;
  text-align: center;
  margin-bottom: 36px;
  font-weight: 700;
}

.choices {
  display: flex;
  gap: 22px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 760px;
}

.choice {
  width: 200px;
  max-width: 42vw;
  background: rgba(255,255,255,0.04);
  border: 2px solid rgba(255,255,255,0.12);
  border-radius: 22px;
  padding: 26px 18px 22px;
  cursor: pointer;
  text-align: center;
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
}
.choice:hover, .choice:active {
  transform: translateY(-8px) scale(1.03);
}
.choice .ic { font-size: 3.4rem; margin-bottom: 12px; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5)); }
.choice .cn {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 1.15rem;
  margin-bottom: 4px;
}
.choice .cd { font-size: 0.82rem; color: #aaa8c8; font-weight: 700; }

.choice.c-robux:hover    { border-color: #ff4d4d; box-shadow: 0 16px 40px rgba(255,77,77,0.3); }
.choice.c-minecoin:hover { border-color: #5bd16a; box-shadow: 0 16px 40px rgba(91,209,106,0.3); }
.choice.c-elmas:hover    { border-color: #4aa3ff; box-shadow: 0 16px 40px rgba(74,163,255,0.35); }

/* ─── Oyun Ekranı ─── */
#gameScreen {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#gameScreen.show { display: flex; }

/* HUD sağ üst sayaç */
#hud {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(0,0,0,0.5);
  border: 1.5px solid var(--accent, #fff);
  border-radius: 40px;
  padding: 9px 18px 9px 13px;
  backdrop-filter: blur(8px);
  box-shadow: 0 0 22px var(--glow, rgba(255,255,255,0.2));
}
#hud .hud-ic { font-size: 1.7rem; line-height: 1; }
#hud .hud-num {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: clamp(1.1rem, 4.6vw, 1.6rem);
  color: var(--accent, #fff);
  min-width: 1ch;
}
#hud .hud-name {
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #d8d6ee;
  opacity: 0.85;
}

/* Tıklanan ana obje */
#clicker {
  position: relative;
  width: clamp(180px, 52vw, 280px);
  height: clamp(180px, 52vw, 280px);
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(5rem, 22vw, 9rem);
  border: none;
  background:
    radial-gradient(circle at 38% 32%, rgba(255,255,255,0.35), rgba(255,255,255,0) 55%),
    var(--coin, #444);
  box-shadow:
    0 0 0 8px rgba(255,255,255,0.06),
    0 18px 50px var(--glow, rgba(0,0,0,0.5)),
    inset 0 -14px 30px rgba(0,0,0,0.35);
  transition: transform 0.08s ease;
  will-change: transform;
}
#clicker:active { transform: scale(0.93); }
#clicker .emoji { filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45)); pointer-events: none; }

.click-hint {
  margin-top: 30px;
  font-weight: 800;
  font-size: clamp(0.9rem, 3.6vw, 1.15rem);
  color: #cfcdec;
  text-align: center;
  letter-spacing: 0.02em;
}
.click-hint b { color: var(--accent, #fff); }

/* Yükseltme paneli alt orta */
#upgrades {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 40;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 94vw;
}
.upg {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 140px;
  padding: 11px 18px;
  border-radius: 16px;
  border: 2px solid var(--accent, #fff);
  background: rgba(0,0,0,0.45);
  color: #fff;
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  font-size: 0.95rem;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: transform 0.2s ease, background 0.2s ease, opacity 0.3s ease;
  animation: popIn 0.4s ease;
}
.upg small { font-size: 0.72rem; font-weight: 700; color: #c7c5e6; }
.upg:hover { transform: translateY(-3px); background: rgba(255,255,255,0.1); }
.upg.active {
  background: var(--accent, #fff);
  color: #05060f;
}
.upg.active small { color: rgba(5,6,15,0.7); }
.upg.locked {
  opacity: 0.4;
  border-color: #555;
  cursor: not-allowed;
  filter: grayscale(0.6);
}

@keyframes popIn {
  from { transform: scale(0.6); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

/* +N uçan parçacıklar */
.float {
  position: fixed;
  z-index: 35;
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 1.5rem;
  color: var(--accent, #fff);
  pointer-events: none;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  animation: floatUp 0.9s ease-out forwards;
}
@keyframes floatUp {
  0%   { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
  20%  { opacity: 1; transform: translate(-50%, -10px) scale(1.15); }
  100% { transform: translate(-50%, -90px) scale(1); opacity: 0; }
}

/* Üst orta bilgi şeridi */
#progress {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 40;
  text-align: center;
  width: min(340px, 70vw);
}
#progressBarWrap {
  height: 8px;
  border-radius: 8px;
  background: rgba(255,255,255,0.1);
  overflow: hidden;
  margin-bottom: 5px;
}
#progressBar {
  height: 100%;
  width: 0%;
  border-radius: 8px;
  background: var(--bar, #fff);
  transition: width 0.25s ease;
}
#progressTxt { font-size: 0.72rem; font-weight: 800; color: #b9b6d8; letter-spacing: 0.04em; }

/* Müzik aç/kapa */
#muteBtn {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 50;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.5);
  color: #fff;
  font-size: 1.3rem;
  cursor: pointer;
  backdrop-filter: blur(6px);
  display: none;
}
#muteBtn.show { display: block; }

/* Final kutlama katmanı */
#finale {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  background: rgba(7,4,26,0.82);
  backdrop-filter: blur(4px);
  animation: fadeIn 0.6s ease;
}
#finale.show { display: flex; }
#finale .fic { font-size: 5rem; animation: spinPop 1s ease; }
#finale h2 {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: clamp(1.6rem, 7vw, 3rem);
  margin: 14px 0 8px;
  background: linear-gradient(90deg, #ffd24a, #ff60c8, #60d4ff);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
#finale p { font-size: clamp(1rem, 4vw, 1.3rem); color: #d8d6ee; font-weight: 800; max-width: 460px; line-height: 1.5; }
#finale .fcont {
  margin-top: 26px;
  padding: 12px 34px;
  border-radius: 40px;
  border: 2px solid #b060ff;
  background: rgba(176,96,255,0.15);
  color: #fff;
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 1rem;
  cursor: pointer;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes spinPop {
  0% { transform: scale(0) rotate(-180deg); }
  70% { transform: scale(1.3) rotate(20deg); }
  100% { transform: scale(1) rotate(0); }
}

#confetti { position: fixed; inset: 0; z-index: 55; pointer-events: none; display: none; }
#confetti.show { display: block; }

@media (max-width: 520px) {
  #hud { padding: 7px 14px 7px 10px; }
  .upg { min-width: 120px; padding: 9px 12px; font-size: 0.85rem; }
}
</style>
</head>
<body>

<div id="app">

  <!-- Seçim ekranı -->
  <div id="selectScreen">
    <h1 class="sel-title">NE KAZANMAK İSTERSİN?</h1>
    <p class="sel-sub">Birini seç, tıklaya tıklaya topla! 🎯</p>
    <div class="choices">
      <div class="choice c-robux" data-type="robux">
        <div class="ic"><img src="assets/robux.png" alt="Robux" style="width:64px;height:64px;object-fit:contain;"></div>
        <div class="cn">ROBUX</div>
        <div class="cd">Roblox parası</div>
      </div>
      <div class="choice c-minecoin" data-type="minecoin">
        <div class="ic"><img src="assets/minecoin.svg" alt="Minecoin" style="width:64px;height:64px;object-fit:contain;"></div>
        <div class="cn">MINECOIN</div>
        <div class="cd">Minecraft parası</div>
      </div>
      <div class="choice c-elmas" data-type="elmas">
        <div class="ic">💎</div>
        <div class="cn">ELMAS</div>
        <div class="cd">Brawl Stars elması</div>
      </div>
    </div>
  </div>

  <!-- Oyun ekranı -->
  <div id="gameScreen">
    <div id="progress">
      <div id="progressBarWrap"><div id="progressBar"></div></div>
      <div id="progressTxt">Hedef: 10.000</div>
    </div>

    <button id="clicker"><span class="emoji" id="clickerEmoji">💎</span></button>
    <p class="click-hint">Tıkla! Her tık <b id="powerTxt">+1</b></p>

    <div id="upgrades">
      <button class="upg locked" id="upgDouble" disabled>
        2'Lİ TIKLAMA
        <small id="upgDoubleSub">70'te açılır</small>
      </button>
      <button class="upg locked" id="upgAuto" disabled>
        OTOMATİK TIKLAMA
        <small id="upgAutoSub">200'de açılır</small>
      </button>
    </div>
  </div>

  <!-- HUD sayaç -->
  <div id="hud">
    <span class="hud-ic" id="hudIc">💎</span>
    <div style="display:flex;flex-direction:column;line-height:1.1;">
      <span class="hud-num" id="hudNum">0</span>
      <span class="hud-name" id="hudName">ELMAS</span>
    </div>
  </div>

  <button id="muteBtn" title="Müzik">🔊</button>

  <!-- Final -->
  <canvas id="confetti"></canvas>
  <div id="finale">
    <div class="fic">🪙</div>
    <h2>UZAYCOIN AÇILDI!</h2>
    <p>10.000'e ulaştın! Artık kazandıkların <b>UZAYCOIN</b>'e dönüştü ve uzay müziği çalıyor. 🚀</p>
    <button class="fcont" id="finaleCont">DEVAM ET →</button>
  </div>

</div>

<a href="../" style="position:fixed;top:16px;left:16px;z-index:9999;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(0,0,0,0.55);color:#fff;font-family:'Orbitron',sans-serif;font-size:0.8rem;font-weight:700;border-radius:30px;text-decoration:none;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);transition:background 0.3s,transform 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.8)';this.style.transform='scale(1.05)'" onmouseout="this.style.background='rgba(0,0,0,0.55)';this.style.transform='scale(1)'">&#8592; Ana Sayfa</a>

<script>
// ─────────── Para birimi tanımları ───────────
const CURR = {
  robux:    { name: 'ROBUX',    emoji: '💚', img: 'assets/robux.png',    coin: 'linear-gradient(145deg,#2ecc71,#0e8a45)', accent: '#3df07d', glow: 'rgba(61,240,125,0.5)', bar: 'linear-gradient(90deg,#3df07d,#0e8a45)', theme: 't-robux' },
  minecoin: { name: 'MINECOIN', emoji: '🟩', img: 'assets/minecoin.svg', coin: 'linear-gradient(145deg,#7fd957,#3a7a28)', accent: '#ffc233', glow: 'rgba(255,194,51,0.5)', bar: 'linear-gradient(90deg,#ffd24a,#b9740c)', theme: 't-minecoin' },
  elmas:    { name: 'ELMAS',    emoji: '💎', coin: 'linear-gradient(145deg,#4aa3ff,#1d5fc4)', accent: '#5db4ff', glow: 'rgba(93,180,255,0.55)', bar: 'linear-gradient(90deg,#5db4ff,#1d5fc4)', theme: 't-elmas' },
  uzaycoin: { name: 'UZAYCOIN', emoji: '🪙', coin: 'linear-gradient(145deg,#b060ff,#6a1fb0)', accent: '#c98aff', glow: 'rgba(201,138,255,0.55)', bar: 'linear-gradient(90deg,#c98aff,#6a1fb0)', theme: 't-uzay' },
};

// Emoji ya da gerçek görsel ikon HTML'i üret
function iconMarkup(c, size) {
  if (c.img) return '<img src="' + c.img + '" alt="' + c.name + '" style="width:' + size + ';height:' + size + ';object-fit:contain;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,0.45));">';
  return c.emoji;
}

const GOAL = 10000;
const DOUBLE_AT = 70;
const AUTO_AT = 200;

// ─────────── Durum ───────────
let state = {
  type: null,
  count: 0,
  clickPower: 1,
  doubleOn: false,
  autoOn: false,
  ended: false,
};

// ─────────── DOM ───────────
const app = document.getElementById('app');
const selectScreen = document.getElementById('selectScreen');
const gameScreen = document.getElementById('gameScreen');
const clicker = document.getElementById('clicker');
const clickerEmoji = document.getElementById('clickerEmoji');
const hudIc = document.getElementById('hudIc');
const hudNum = document.getElementById('hudNum');
const hudName = document.getElementById('hudName');
const powerTxt = document.getElementById('powerTxt');
const upgDouble = document.getElementById('upgDouble');
const upgAuto = document.getElementById('upgAuto');
const upgDoubleSub = document.getElementById('upgDoubleSub');
const upgAutoSub = document.getElementById('upgAutoSub');
const progressBar = document.getElementById('progressBar');
const progressTxt = document.getElementById('progressTxt');
const muteBtn = document.getElementById('muteBtn');
const finale = document.getElementById('finale');
const finaleCont = document.getElementById('finaleCont');

// ─────────── Tema uygula ───────────
function applyCurrency(type) {
  const c = CURR[type];
  app.className = c.theme;
  document.documentElement.style.setProperty('--coin', c.coin);
  document.documentElement.style.setProperty('--accent', c.accent);
  document.documentElement.style.setProperty('--glow', c.glow);
  document.documentElement.style.setProperty('--bar', c.bar);
  clickerEmoji.innerHTML = iconMarkup(c, 'clamp(110px,34vw,180px)');
  hudIc.innerHTML = iconMarkup(c, '1.7rem');
  hudName.textContent = c.name;
}

function fmt(n) { return n.toLocaleString('tr-TR'); }

function updateHUD() {
  hudNum.textContent = fmt(state.count);
  powerTxt.textContent = '+' + state.clickPower;
  const pct = Math.min(100, (state.count / GOAL) * 100);
  progressBar.style.width = pct + '%';
  if (!state.ended) progressTxt.textContent = 'Hedef: ' + fmt(GOAL) + '  (' + Math.floor(pct) + '%)';
}

// ─────────── Tıklama ───────────
function doClick(clientX, clientY) {
  if (state.ended && state.type === 'uzaycoin') {
    // final sonrası uzaycoin toplamaya devam
  }
  const gain = state.clickPower;
  state.count += gain;
  updateHUD();
  spawnFloat('+' + gain, clientX, clientY);
  blip();
  checkUnlocks();
  if (!state.ended && state.count >= GOAL) endGame();
}

function spawnFloat(txt, x, y) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = txt;
  el.style.left = x + 'px';
  el.style.top = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

clicker.addEventListener('click', (e) => {
  doClick(e.clientX, e.clientY);
});
// Dokunmatik: anında tepki
clicker.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  doClick(t.clientX, t.clientY);
}, { passive: false });

// ─────────── Yükseltmeler ───────────
function checkUnlocks() {
  if (state.count >= DOUBLE_AT && upgDouble.classList.contains('locked')) {
    upgDouble.classList.remove('locked');
    upgDouble.disabled = false;
    upgDoubleSub.textContent = 'Aç → her tık +2';
    pling();
  }
  if (state.count >= AUTO_AT && upgAuto.classList.contains('locked')) {
    upgAuto.classList.remove('locked');
    upgAuto.disabled = false;
    upgAutoSub.textContent = 'Aç → kendiliğinden';
    pling();
  }
}

upgDouble.addEventListener('click', () => {
  if (upgDouble.classList.contains('locked')) return;
  state.doubleOn = !state.doubleOn;
  state.clickPower = state.doubleOn ? 2 : 1;
  upgDouble.classList.toggle('active', state.doubleOn);
  upgDoubleSub.textContent = state.doubleOn ? 'AÇIK · her tık +2' : 'Kapalı · her tık +1';
  updateHUD();
  pling();
});

let autoTimer = null;
upgAuto.addEventListener('click', () => {
  if (upgAuto.classList.contains('locked')) return;
  state.autoOn = !state.autoOn;
  upgAuto.classList.toggle('active', state.autoOn);
  upgAutoSub.textContent = state.autoOn ? 'AÇIK · saniyede 5' : 'Kapalı';
  pling();
  if (state.autoOn) {
    autoTimer = setInterval(() => {
      const r = clicker.getBoundingClientRect();
      const x = r.left + r.width / 2 + (Math.random() - 0.5) * r.width * 0.5;
      const y = r.top + r.height / 2 + (Math.random() - 0.5) * r.height * 0.4;
      doClick(x, y);
    }, 200);
  } else {
    clearInterval(autoTimer);
    autoTimer = null;
  }
});

// ─────────── Oyunu başlat ───────────
document.querySelectorAll('.choice').forEach(ch => {
  ch.addEventListener('click', () => startGame(ch.dataset.type));
});

function startGame(type) {
  state.type = type;
  applyCurrency(type);
  updateHUD();
  selectScreen.style.display = 'none';
  gameScreen.classList.add('show');
  muteBtn.classList.add('show');
  initAudio();
  playTheme(type);
}

// ─────────── Final: 10.000 → UZAYCOIN ───────────
function endGame() {
  state.ended = true;
  state.type = 'uzaycoin';
  applyCurrency('uzaycoin');
  progressBar.style.width = '100%';
  progressTxt.textContent = '🏆 TAMAMLANDI! UZAYCOIN modu';
  updateHUD();
  playTheme('uzay');
  finale.classList.add('show');
  startConfetti();
}

finaleCont.addEventListener('click', () => {
  finale.classList.remove('show');
  stopConfetti();
});

// ═══════════ SES / MÜZİK (Web Audio) ═══════════
let actx = null, masterGain = null, muted = false;
let currentTheme = null, themeTimers = [];

function initAudio() {
  initSfx();
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = actx.createGain();
    masterGain.gain.value = 0.5;
    masterGain.connect(actx.destination);
  } catch (e) { actx = null; }
}

// ─── Gerçek ses dosyaları (CC0) + sentez fallback ───
let clickSfx = [], clickIdx = 0, upgradeSfx = null, sfxReady = false;
function initSfx() {
  if (sfxReady) return;
  sfxReady = true;
  try {
    for (let i = 0; i < 5; i++) { const a = new Audio('assets/click.ogg'); a.volume = 0.5; clickSfx.push(a); }
    upgradeSfx = new Audio('assets/levelup.ogg'); upgradeSfx.volume = 0.6;
  } catch (e) { sfxReady = false; }
}

// Tıklama sesi: gerçek coin .ogg, olmazsa sentez
function blip() {
  if (muted) return;
  if (clickSfx.length) {
    const a = clickSfx[clickIdx];
    clickIdx = (clickIdx + 1) % clickSfx.length;
    try { a.currentTime = 0; const p = a.play(); if (p) p.catch(() => blipSynth()); return; } catch (e) {}
  }
  blipSynth();
}

// Yükseltme sesi: gerçek level-up .ogg, olmazsa sentez
function pling() {
  if (muted) return;
  if (upgradeSfx) {
    try { upgradeSfx.currentTime = 0; const p = upgradeSfx.play(); if (p) p.catch(() => plingSynth()); return; } catch (e) {}
  }
  plingSynth();
}

// Kısa tık sesi (sentez fallback)
function blipSynth() {
  if (!actx || muted) return;
  const c = CURR[state.type] || CURR.elmas;
  const o = actx.createOscillator();
  const g = actx.createGain();
  // Her para birimine farklı tık tınısı
  const baseFreq = state.type === 'robux' ? 520 : state.type === 'minecoin' ? 660 : state.type === 'uzaycoin' ? 880 : 740;
  o.type = state.type === 'minecoin' ? 'sine' : 'triangle';
  o.frequency.setValueAtTime(baseFreq, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, actx.currentTime + 0.06);
  g.gain.setValueAtTime(0.0001, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.12);
  o.connect(g); g.connect(masterGain);
  o.start(); o.stop(actx.currentTime + 0.13);
}

// Yükseltme/onay sesi (sentez fallback)
function plingSynth() {
  if (!actx || muted) return;
  [0, 0.09].forEach((t, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle';
    o.frequency.value = i === 0 ? 660 : 990;
    g.gain.setValueAtTime(0.0001, actx.currentTime + t);
    g.gain.exponentialRampToValueAtTime(0.22, actx.currentTime + t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t + 0.18);
    o.connect(g); g.connect(masterGain);
    o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.2);
  });
}

// Nota frekansları
const N = { C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.0,A3:220.0,B3:246.94,
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.0,A4:440.0,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.0,B5:987.77,C6:1046.5,0:0 };

// Tema müzikleri: { bpm, wave, notes:[[freq, beats],...], bass:[...] }
const THEMES = {
  // Roblox: neşeli, zıplayan, majör arpejli
  robux: {
    bpm: 150, wave: 'square', vol: 0.16,
    notes: [['C5',1],['E5',1],['G5',1],['E5',1],['F5',1],['A5',1],['G5',1],['E5',1],
            ['D5',1],['F5',1],['A5',1],['F5',1],['G5',1],['C6',2],['B5',1]],
    bass:  [['C3',2],['F3',2],['G3',2],['C3',2]]
  },
  // Minecraft: sakin, yumuşak, sine piyano (Sweden havası)
  minecoin: {
    bpm: 92, wave: 'sine', vol: 0.20,
    notes: [['E4',2],['G4',2],['B4',2],['C5',2],['B4',2],['G4',2],['A4',2],['E4',2],
            ['F4',2],['A4',2],['C5',2],['A4',2],['G4',4]],
    bass:  [['C3',4],['A3',4],['F3',4],['G3',4]]
  },
  // Brawl Stars: enerjik, vurucu, sawtooth
  elmas: {
    bpm: 168, wave: 'sawtooth', vol: 0.13,
    notes: [['A4',1],['A4',1],['C5',1],['E5',1],['D5',1],['C5',1],['A4',2],
            ['G4',1],['A4',1],['C5',1],['D5',1],['E5',2],['D5',1],['C5',1]],
    bass:  [['A3',1],['A3',1],['E3',2],['F3',1],['F3',1],['G3',2]]
  },
  // Uzay: ambient, yavaş, hayalperest
  uzay: {
    bpm: 70, wave: 'sine', vol: 0.22,
    notes: [['A4',4],['C5',4],['E5',4],['D5',4],['C5',4],['E5',4],['G5',4],['A5',4]],
    bass:  [['A3',8],['F3',8],['C3',8],['G3',8]]
  },
};

// Gerçek müzik dosyası olan temalar (CC0). Diğerleri sentezle çalar.
const MUSIC = { robux: 'assets/music-robux.mp3', uzay: 'assets/music-uzay.ogg' };
let bgm = null;

function stopTheme() {
  themeTimers.forEach(t => clearTimeout(t));
  themeTimers = [];
  currentTheme = null;
}
function stopBgm() {
  if (bgm) { try { bgm.pause(); bgm.currentTime = 0; } catch (e) {} }
}

function playSynthTheme(themeKey) {
  if (!actx) return;
  currentTheme = themeKey;
  scheduleLoop(themeKey);
}

function playTheme(key) {
  // 'elmas' seçilince brawl teması; uzay/robux/minecoin kendi anahtarı
  const themeKey = THEMES[key] ? key : 'uzay';
  stopTheme();
  if (MUSIC[themeKey]) {
    // Gerçek müzik dosyası
    stopBgm();
    if (!bgm) bgm = new Audio();
    bgm.src = MUSIC[themeKey];
    bgm.loop = true;
    bgm.volume = muted ? 0 : 0.5;
    const p = bgm.play();
    if (p) p.catch(() => playSynthTheme(themeKey)); // engellenirse sentez
  } else {
    // Sentez tema (minecoin / elmas)
    stopBgm();
    playSynthTheme(themeKey);
  }
}

function scheduleLoop(themeKey) {
  if (currentTheme !== themeKey || !actx) return;
  const th = THEMES[themeKey];
  const beat = 60 / th.bpm;
  let t = actx.currentTime + 0.05;
  const startT = t;

  // Melodi
  th.notes.forEach(([note, beats]) => {
    const dur = beats * beat;
    if (N[note]) playMusNote(N[note], t, dur * 0.92, th.wave, th.vol);
    t += dur;
  });
  const melodyEnd = t;

  // Bas (döngü boyunca tekrarlı)
  let bt = startT;
  while (bt < melodyEnd - 0.01) {
    th.bass.forEach(([note, beats]) => {
      const dur = beats * beat;
      if (bt < melodyEnd && N[note]) playMusNote(N[note] / 2, bt, dur * 0.9, 'triangle', th.vol * 0.5);
      bt += dur;
    });
  }

  const loopMs = (melodyEnd - actx.currentTime) * 1000;
  const id = setTimeout(() => scheduleLoop(themeKey), Math.max(50, loopMs - 60));
  themeTimers.push(id);
}

function playMusNote(freq, start, dur, wave, vol) {
  if (!actx || muted) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave;
  o.frequency.value = freq;
  const a = 0.02, r = Math.min(0.25, dur * 0.4);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start + a);
  g.gain.setValueAtTime(vol, start + Math.max(a, dur - r));
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g); g.connect(masterGain);
  o.start(start); o.stop(start + dur + 0.02);
}

// Müzik aç/kapa
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.5;
  if (bgm) bgm.volume = muted ? 0 : 0.5;
});

// ═══════════ Konfeti ═══════════
const confettiCanvas = document.getElementById('confetti');
const cctx = confettiCanvas.getContext('2d');
let confParts = [], confRAF = null;

function startConfetti() {
  confettiCanvas.classList.add('show');
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
  confParts = [];
  const colors = ['#ffd24a','#ff60c8','#60d4ff','#b060ff','#5bd16a'];
  for (let i = 0; i < 140; i++) {
    confParts.push({
      x: Math.random() * confettiCanvas.width,
      y: Math.random() * -confettiCanvas.height,
      r: Math.random() * 6 + 4,
      c: colors[Math.floor(Math.random() * colors.length)],
      vy: Math.random() * 3 + 2,
      vx: (Math.random() - 0.5) * 2,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.2,
    });
  }
  loopConfetti();
}
function loopConfetti() {
  cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  confParts.forEach(p => {
    p.y += p.vy; p.x += p.vx; p.rot += p.vr;
    if (p.y > confettiCanvas.height + 20) { p.y = -20; p.x = Math.random() * confettiCanvas.width; }
    cctx.save();
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    cctx.fillStyle = p.c;
    cctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6);
    cctx.restore();
  });
  confRAF = requestAnimationFrame(loopConfetti);
}
function stopConfetti() {
  // yavaşça bitir
  setTimeout(() => {
    cancelAnimationFrame(confRAF);
    confRAF = null;
    confettiCanvas.classList.remove('show');
  }, 100);
}
window.addEventListener('resize', () => {
  if (confettiCanvas.classList.contains('show')) {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
});

// Klavye desteği: boşluk = tıkla
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && gameScreen.classList.contains('show')) {
    e.preventDefault();
    const r = clicker.getBoundingClientRect();
    doClick(r.left + r.width / 2, r.top + r.height / 2);
  }
});

updateHUD();
</script>
