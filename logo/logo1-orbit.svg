<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" font-family="Orbitron, sans-serif">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&amp;display=swap');</style>
    <linearGradient id="g1grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#00c8ff"/>
    </linearGradient>
    <radialGradient id="g1planet" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#3a1170"/>
    </radialGradient>
    <filter id="g1glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="200" fill="#050510"/>
  <!-- little stars -->
  <g fill="#cdd6ff">
    <circle cx="50" cy="40" r="1.2"/><circle cx="120" cy="160" r="1"/><circle cx="600" cy="50" r="1.3"/>
    <circle cx="560" cy="150" r="1"/><circle cx="300" cy="30" r="1"/><circle cx="430" cy="170" r="1.1"/>
  </g>
  <!-- emblem -->
  <g transform="translate(110,100)" filter="url(#g1glow)">
    <ellipse cx="0" cy="0" rx="74" ry="26" fill="none" stroke="url(#g1grad)" stroke-width="3" transform="rotate(-25)"/>
    <circle cx="0" cy="0" r="40" fill="url(#g1planet)"/>
    <ellipse cx="-12" cy="-12" rx="14" ry="9" fill="#ffffff" opacity="0.25"/>
    <circle cx="62" cy="-26" r="6" fill="#7df9ff" transform="rotate(-25)"/>
  </g>
  <!-- wordmark -->
  <text x="210" y="98" font-size="52" font-weight="900" letter-spacing="6" fill="url(#g1grad)">UZAY</text>
  <text x="210" y="150" font-size="52" font-weight="900" letter-spacing="6" fill="#e8e0f0">ZONE</text>
  <text x="214" y="174" font-size="13" font-weight="400" letter-spacing="9" fill="#8888aa">OYUN PORTALI</text>
</svg>
