<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Orbitron, sans-serif">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&amp;display=swap');</style>
    <linearGradient id="g2grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="g2core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="0.7" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#1a0a3a"/>
    </radialGradient>
    <filter id="g2glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#050510"/>
  <g fill="#cdd6ff">
    <circle cx="60" cy="70" r="1.4"/><circle cx="340" cy="90" r="1.2"/><circle cx="320" cy="330" r="1.3"/>
    <circle cx="70" cy="320" r="1"/><circle cx="200" cy="40" r="1.1"/>
  </g>
  <!-- portal rings -->
  <g transform="translate(200,200)" filter="url(#g2glow)">
    <circle r="120" fill="url(#g2core)" stroke="url(#g2grad)" stroke-width="5"/>
    <circle r="138" fill="none" stroke="url(#g2grad)" stroke-width="2" opacity="0.5"/>
    <ellipse rx="150" ry="56" fill="none" stroke="#00c8ff" stroke-width="2.5" opacity="0.6" transform="rotate(-20)"/>
    <!-- stylized Z as a shooting trail -->
    <path d="M -52 -46 L 52 -46 L -40 46 L 56 46" fill="none" stroke="url(#g2grad)"
          stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="56" cy="46" r="9" fill="#7df9ff"/>
  </g>
  <text x="200" y="372" text-anchor="middle" font-size="40" font-weight="900" letter-spacing="10" fill="url(#g2grad)">UZAY ZONE</text>
</svg>
