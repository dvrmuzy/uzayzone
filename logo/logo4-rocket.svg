<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Orbitron, sans-serif">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&amp;display=swap');</style>
    <linearGradient id="g4grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="g4flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#ff4500"/>
    </linearGradient>
    <filter id="g4glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#050510"/>
  <g fill="#cdd6ff">
    <circle cx="70" cy="80" r="1.4"/><circle cx="330" cy="70" r="1.2"/><circle cx="60" cy="300" r="1.1"/>
    <circle cx="340" cy="310" r="1.3"/><circle cx="200" cy="50" r="1"/>
  </g>
  <!-- hex badge -->
  <g transform="translate(200,170)" filter="url(#g4glow)">
    <path d="M0 -110 L95 -55 L95 55 L0 110 L-95 55 L-95 -55 Z"
          fill="#0b0b22" stroke="url(#g4grad)" stroke-width="5"/>
    <path d="M0 -110 L95 -55 L95 55 L0 110 L-95 55 L-95 -55 Z"
          fill="none" stroke="url(#g4grad)" stroke-width="1.5" opacity="0.4" transform="scale(1.1)"/>
    <!-- rocket -->
    <g transform="rotate(45)">
      <path d="M0 -58 C26 -34 26 6 12 34 L-12 34 C-26 6 -26 -34 0 -58 Z" fill="url(#g4grad)"/>
      <circle cx="0" cy="-18" r="11" fill="#0b0b22"/>
      <circle cx="0" cy="-18" r="6" fill="#7df9ff"/>
      <path d="M-12 22 L-30 46 L-12 38 Z" fill="#a855f7"/>
      <path d="M12 22 L30 46 L12 38 Z" fill="#00c8ff"/>
      <path d="M-9 34 C-4 56 4 56 9 34 Z" fill="url(#g4flame)"/>
    </g>
  </g>
  <text x="200" y="350" text-anchor="middle" font-size="42" font-weight="900" letter-spacing="8" fill="url(#g4grad)">UZAY ZONE</text>
</svg>
