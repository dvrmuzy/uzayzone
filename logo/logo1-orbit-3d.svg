<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" font-family="Orbitron, sans-serif">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&amp;display=swap');</style>

    <!-- backdrop -->
    <radialGradient id="bg" cx="0.22" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#0c0a24"/>
      <stop offset="0.6" stop-color="#070617"/>
      <stop offset="1" stop-color="#030208"/>
    </radialGradient>

    <!-- 3D sphere body -->
    <radialGradient id="sphere" cx="0.34" cy="0.30" r="0.85">
      <stop offset="0"   stop-color="#dffaff"/>
      <stop offset="0.18" stop-color="#7df2ff"/>
      <stop offset="0.5"  stop-color="#5aa8f7"/>
      <stop offset="0.5"  stop-color="#7d5cf0"/>
      <stop offset="0.82" stop-color="#5a23b8"/>
      <stop offset="1"    stop-color="#220a52"/>
    </radialGradient>
    <!-- terminator shadow (darkens far side) -->
    <radialGradient id="terminator" cx="0.32" cy="0.28" r="0.9">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#05010f" stop-opacity="0.78"/>
    </radialGradient>
    <!-- specular highlight -->
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- rim light -->
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.82" stop-color="#00c8ff" stop-opacity="0"/>
      <stop offset="0.97" stop-color="#7df9ff" stop-opacity="0.85"/>
      <stop offset="1"    stop-color="#7df9ff" stop-opacity="0"/>
    </radialGradient>

    <!-- moon sphere -->
    <radialGradient id="moon" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b9a7ff"/>
      <stop offset="1" stop-color="#3a1f7a"/>
    </radialGradient>

    <!-- ring gradients (front bright / back dim) -->
    <linearGradient id="ringFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="0.5" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ringBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c5a82"/>
      <stop offset="1" stop-color="#4a2a80"/>
    </linearGradient>

    <!-- wordmark face -->
    <linearGradient id="wordTop" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#9fefff"/>
      <stop offset="0.45" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#c98bff"/>
    </linearGradient>

    <clipPath id="planetClip"><circle r="64"/></clipPath>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="280" rx="0" fill="url(#bg)"/>

  <!-- background stars -->
  <g fill="#cdd6ff">
    <circle cx="60" cy="48" r="1.4" opacity=".9"/><circle cx="250" cy="40" r="1" opacity=".6"/>
    <circle cx="700" cy="60" r="1.5" opacity=".9"/><circle cx="660" cy="220" r="1.1" opacity=".7"/>
    <circle cx="40" cy="230" r="1.2" opacity=".7"/><circle cx="320" cy="250" r="1" opacity=".5"/>
    <circle cx="560" cy="30" r="1" opacity=".6"/><circle cx="200" cy="220" r="1.2" opacity=".7"/>
  </g>

  <!-- ===== PLANET SYSTEM ===== -->
  <g transform="translate(170,140)">

    <!-- outer atmosphere glow -->
    <circle r="86" fill="#00c8ff" opacity="0.18" filter="url(#soft)"/>
    <circle r="70" fill="#a855f7" opacity="0.16" filter="url(#soft)"/>

    <!-- ground shadow under system -->
    <ellipse cy="92" rx="92" ry="14" fill="#000" opacity="0.45" filter="url(#soft)"/>

    <!-- ORBIT — back half (behind planet) -->
    <g transform="rotate(-24)">
      <path d="M -118 0 C -118 -38 118 -38 118 0" fill="none" stroke="url(#ringBack)" stroke-width="5" opacity="0.7"/>
    </g>

    <!-- moon behind portion (small, far side) -->
    <g transform="rotate(-24)">
      <circle cx="-108" cy="-6" r="8" fill="url(#moon)" opacity="0.85"/>
    </g>

    <!-- PLANET sphere -->
    <circle r="64" fill="url(#sphere)"/>
    <!-- surface bands for depth -->
    <g opacity="0.25" clip-path="url(#planetClip)" fill="none" stroke="#1a0a40" stroke-width="3">
      <path d="M -60 -22 C -20 -32 30 -28 60 -16"/>
      <path d="M -62 6 C -20 -2 30 2 62 14"/>
      <path d="M -52 30 C -16 24 26 30 54 40"/>
    </g>
    <circle r="64" fill="url(#terminator)"/>
    <circle r="64" fill="url(#rim)"/>
    <!-- specular hotspot -->
    <ellipse cx="-20" cy="-22" rx="20" ry="14" fill="url(#spec)" transform="rotate(-20 -20 -22)"/>

    <!-- ORBIT — front half (in front of planet) -->
    <g transform="rotate(-24)" filter="url(#glow)">
      <path d="M -118 0 C -118 38 118 38 118 0" fill="none" stroke="url(#ringFront)" stroke-width="6"/>
    </g>

    <!-- MOON front (3D shaded, with glow) -->
    <g transform="rotate(-24)">
      <g transform="translate(112,6)" filter="url(#glow)">
        <circle r="13" fill="url(#moon)"/>
        <ellipse cx="-4" cy="-4" rx="4" ry="3" fill="#fff" opacity="0.7"/>
      </g>
    </g>
  </g>

  <!-- ===== WORDMARK (extruded 3D) ===== -->
  <g font-weight="900" letter-spacing="6">
    <!-- extrusion depth: stacked dark copies offset down-right -->
    <g fill="#1b0e44">
      <text x="312" y="135.5" font-size="62">UZAY</text>
      <text x="312" y="206.5" font-size="62">ZONE</text>
    </g>
    <g fill="#160a38">
      <text x="311" y="134.5" font-size="62">UZAY</text>
      <text x="311" y="205.5" font-size="62">ZONE</text>
    </g>
    <g fill="#241357">
      <text x="310" y="133" font-size="62">UZAY</text>
      <text x="310" y="204" font-size="62">ZONE</text>
    </g>
    <!-- top face -->
    <g filter="url(#glow)">
      <text x="308" y="131" font-size="62" fill="url(#wordTop)">UZAY</text>
      <text x="308" y="202" font-size="62" fill="#eef1ff">ZONE</text>
    </g>
  </g>
  <text x="312" y="232" font-size="13" font-weight="400" letter-spacing="11" fill="#8c8cb4">OYUN PORTALI</text>
</svg>
