<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Yıldız Avcısı</title>
<link rel="icon" href="../logo/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../logo/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../logo/favicon-16.png">
<link rel="icon" type="image/svg+xml" href="../logo/favicon.svg">
<link rel="apple-touch-icon" href="../logo/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #02030a;
  font-family: 'Orbitron', sans-serif;
  color: #d8eaff;
  user-select: none;
  touch-action: none;
}

#game {
  display: block;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 100%, #0a0830 0%, #04031a 45%, #02030a 100%);
  cursor: crosshair;
}

.hud {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
  z-index: 10;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.hud-left, .hud-right {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.hud-right { align-items: flex-end; }

.hud-label {
  font-size: 0.65rem;
  color: #6a7ba8;
  letter-spacing: 0.2em;
}

.hud-value {
  font-size: 1.3rem;
  color: #7df9ff;
  text-shadow: 0 0 12px rgba(125,249,255,0.6);
}

.lives {
  display: flex;
  gap: 5px;
}

.life-icon {
  width: 16px; height: 16px;
  background: linear-gradient(180deg, #ff4f8a, #b44eff);
  clip-path: polygon(50% 0, 100% 100%, 50% 75%, 0 100%);
  filter: drop-shadow(0 0 6px rgba(255,79,138,0.6));
}

.wave-banner {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 20;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}

.wave-banner.show { opacity: 1; }

.wave-label {
  font-size: 0.9rem;
  letter-spacing: 0.4em;
  color: #8ea9ff;
  margin-bottom: 8px;
}

.wave-num {
  font-size: 3.8rem;
  font-weight: 900;
  background: linear-gradient(135deg, #7df9ff, #b44eff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 40px rgba(125,249,255,0.3);
  filter: drop-shadow(0 0 20px rgba(180,78,255,0.4));
}

.overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(2,3,15,0.85);
  backdrop-filter: blur(6px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}

.overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.panel {
  text-align: center;
  padding: 36px 44px;
  max-width: 90%;
}

.panel h1 {
  font-size: 2.8rem;
  font-weight: 900;
  letter-spacing: 0.1em;
  background: linear-gradient(135deg, #7df9ff, #b44eff, #ff4f8a);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3s ease infinite;
  margin-bottom: 8px;
}

.panel .tag {
  font-size: 0.75rem;
  letter-spacing: 0.3em;
  color: #8ea9ff;
  margin-bottom: 28px;
}

.panel .instr {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.85rem;
  line-height: 1.9;
  color: #aab8d8;
  margin-bottom: 28px;
  letter-spacing: 0.05em;
}

.panel .instr b { color: #7df9ff; }

.panel .stats {
  display: flex;
  justify-content: center;
  gap: 36px;
  margin-bottom: 28px;
}

.stat-block {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.stat-block .stat-label {
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: #6a7ba8;
}

.stat-block .stat-val {
  font-size: 1.8rem;
  font-weight: 900;
  color: #7df9ff;
  text-shadow: 0 0 14px rgba(125,249,255,0.5);
}

.btn {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: 0.18em;
  color: #7df9ff;
  background: transparent;
  border: 2px solid #7df9ff;
  border-radius: 30px;
  padding: 14px 42px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
}

.btn:hover {
  background: #7df9ff;
  color: #02030a;
  box-shadow: 0 0 30px rgba(125,249,255,0.6);
  transform: scale(1.05);
}

.power-indicators {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 10;
  pointer-events: none;
}

.power-pill {
  padding: 6px 14px;
  border-radius: 20px;
  background: rgba(125,249,255,0.12);
  border: 1px solid rgba(125,249,255,0.4);
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  color: #7df9ff;
  font-weight: 700;
  backdrop-filter: blur(6px);
  animation: pulseGlow 1s ease-in-out infinite;
}

.power-pill.shield { color: #8effb6; border-color: rgba(142,255,182,0.4); background: rgba(142,255,182,0.12); }
.power-pill.triple { color: #ffd24f; border-color: rgba(255,210,79,0.4); background: rgba(255,210,79,0.12); }
.power-pill.rapid { color: #ff7df9; border-color: rgba(255,125,249,0.4); background: rgba(255,125,249,0.12); }

.diff-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.diff-btn {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 0.78rem;
  letter-spacing: 0.18em;
  color: #8ea9ff;
  background: transparent;
  border: 2px solid rgba(142,169,255,0.4);
  border-radius: 20px;
  padding: 10px 22px;
  cursor: pointer;
  transition: all 0.25s ease;
  text-transform: uppercase;
  position: relative;
  z-index: 2;
  -webkit-appearance: none;
  appearance: none;
  outline: none;
}
.diff-btn:hover {
  border-color: #7df9ff;
  color: #7df9ff;
  transform: translateY(-1px);
}
.diff-btn.active { transform: scale(1.08); font-weight: 900; }
.diff-btn.active.easy { background: #8effb6; border-color: #8effb6; color: #02030a; box-shadow: 0 0 24px rgba(142,255,182,0.7); }
.diff-btn.active.medium { background: #7df9ff; border-color: #7df9ff; color: #02030a; box-shadow: 0 0 24px rgba(125,249,255,0.7); }
.diff-btn.active.hard { background: #ff4f8a; border-color: #ff4f8a; color: #02030a; box-shadow: 0 0 24px rgba(255,79,138,0.7); }
.diff-label {
  font-size: 0.62rem;
  letter-spacing: 0.25em;
  color: #6a7ba8;
  margin-bottom: 10px;
  text-align: center;
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 8px currentColor; opacity: 0.85; }
  50% { box-shadow: 0 0 20px currentColor; opacity: 1; }
}

@keyframes shimmer {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@media (max-width: 640px) {
  .hud-value { font-size: 1rem; }
  .hud-label { font-size: 0.55rem; }
  .panel h1 { font-size: 2rem; }
  .panel .instr { font-size: 0.75rem; }
  .panel .stats { gap: 22px; }
  .stat-block .stat-val { font-size: 1.4rem; }
  .wave-num { font-size: 2.8rem; }
}
</style>
<script src="../analytics.js"></script>
<script src="../hesap.js" defer></script>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <div class="hud-left">
    <div class="hud-label">SKOR</div>
    <div class="hud-value" id="score">0</div>
  </div>
  <div class="hud-right">
    <div class="hud-label">DALGA <span id="waveText">1</span></div>
    <div class="lives" id="lives"></div>
  </div>
</div>

<div class="power-indicators" id="powerIndicators"></div>

<div class="wave-banner" id="waveBanner">
  <div class="wave-label">DALGA</div>
  <div class="wave-num" id="waveBannerNum">1</div>
</div>

<div class="overlay show" id="startOverlay">
  <div class="panel">
    <h1>YILDIZ AVCISI</h1>
    <div class="tag">UZAY SAVAŞI</div>
    <div class="instr">
      <b>MASAÜSTÜ:</b> Hareket için <b>FARE</b> · Ateş otomatik<br>
      <b>MOBİL:</b> Parmağınla sürükle · Ateş otomatik<br>
      Asteroidleri ve düşmanları yok et. <b>Power-up</b> topla!
    </div>
    <div class="diff-label">ZORLUK SEÇ</div>
    <div class="diff-row" data-diff-group="start">
      <button class="diff-btn easy" data-diff="easy">KOLAY</button>
      <button class="diff-btn medium active" data-diff="medium">ORTA</button>
      <button class="diff-btn hard" data-diff="hard">ZOR</button>
    </div>
    <button class="btn" id="startBtn">BAŞLA</button>
  </div>
</div>

<div class="overlay" id="endOverlay">
  <div class="panel">
    <h1 id="endTitle">OYUN BİTTİ</h1>
    <div class="tag" id="endTag">YENİDEN DENE</div>
    <div class="stats">
      <div class="stat-block">
        <div class="stat-label">SKOR</div>
        <div class="stat-val" id="endScore">0</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">DALGA</div>
        <div class="stat-val" id="endWave">1</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">REKOR</div>
        <div class="stat-val" id="endBest">0</div>
      </div>
    </div>
    <div class="diff-label">ZORLUK</div>
    <div class="diff-row" data-diff-group="end">
      <button class="diff-btn easy" data-diff="easy">KOLAY</button>
      <button class="diff-btn medium active" data-diff="medium">ORTA</button>
      <button class="diff-btn hard" data-diff="hard">ZOR</button>
    </div>
    <button class="btn" id="restartBtn">TEKRAR OYNA</button>
  </div>
</div>

<a href="../" style="position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(2,3,15,0.7);color:#7df9ff;font-family:'Orbitron',sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:0.15em;border-radius:30px;text-decoration:none;backdrop-filter:blur(8px);border:1px solid rgba(125,249,255,0.3);transition:all 0.3s;" onmouseover="this.style.background='rgba(125,249,255,0.2)';this.style.transform='translateX(-50%) scale(1.05)'" onmouseout="this.style.background='rgba(2,3,15,0.7)';this.style.transform='translateX(-50%) scale(1)'">← ANA SAYFA</a>

<script>
// ─── Setup ───
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ─── Audio ───
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type = 'sine', vol = 0.15) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration);
}

function sndShoot() { playTone(880, 0.06, 'square', 0.05); }
function sndExplode() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(180, t);
  osc.frequency.exponentialRampToValueAtTime(40, t + 0.25);
  gain.gain.setValueAtTime(0.18, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.25);
}
function sndHit() { playTone(300, 0.08, 'square', 0.1); }
function sndPower() {
  playTone(523, 0.08, 'triangle', 0.18);
  setTimeout(() => playTone(784, 0.12, 'triangle', 0.18), 70);
}
function sndDamage() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(500, t);
  osc.frequency.exponentialRampToValueAtTime(80, t + 0.4);
  gain.gain.setValueAtTime(0.22, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.4);
}
function sndWave() {
  playTone(440, 0.1, 'triangle', 0.15);
  setTimeout(() => playTone(660, 0.1, 'triangle', 0.15), 100);
  setTimeout(() => playTone(880, 0.18, 'triangle', 0.15), 200);
}

// ─── Difficulty ───
const DIFF = {
  easy:   { lives: 5, astSpeedMul: 0.75, astSpawnMul: 1.35, enemySpawnMul: 1.6, enemyHpDelta: -1, waveTargetMul: 0.85, scoreMul: 0.8 },
  medium: { lives: 3, astSpeedMul: 1.0,  astSpawnMul: 1.0,  enemySpawnMul: 1.0, enemyHpDelta: 0,  waveTargetMul: 1.0,  scoreMul: 1.0 },
  hard:   { lives: 2, astSpeedMul: 1.3,  astSpawnMul: 0.75, enemySpawnMul: 0.65, enemyHpDelta: 1,  waveTargetMul: 1.15, scoreMul: 1.4 }
};
let difficulty = localStorage.getItem('yildizAvcisiDiff') || 'medium';

// ─── Game State ───
const STATE = {
  running: false,
  score: 0,
  wave: 1,
  lives: 3,
  best: parseInt(localStorage.getItem('yildizAvcisiBest') || '0', 10),
  player: null,
  bullets: [],
  asteroids: [],
  enemies: [],
  enemyBullets: [],
  particles: [],
  powerups: [],
  stars: [],
  shake: 0,
  waveTimer: 0,
  spawnTimer: 0,
  enemySpawnTimer: 0,
  shieldUntil: 0,
  tripleUntil: 0,
  rapidUntil: 0,
  lastShot: 0,
  invulnUntil: 0,
  killsThisWave: 0,
  waveTarget: 8
};

// ─── Player ───
function createPlayer() {
  return { x: W / 2, y: H - 100, tx: W / 2, ty: H - 100, r: 18, glow: 0 };
}

// ─── Stars Background ───
function createStars() {
  STATE.stars = [];
  const count = Math.floor((W * H) / 3500);
  for (let i = 0; i < count; i++) {
    STATE.stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      s: Math.random() * 1.2 + 0.4,
      a: Math.random() * 0.6 + 0.3
    });
  }
}
createStars();
window.addEventListener('resize', createStars);

// ─── Input ───
let pointerX = W / 2, pointerY = H - 100, pointerActive = false;

function setPointer(clientX, clientY) {
  pointerX = clientX;
  pointerY = clientY;
}

canvas.addEventListener('mousemove', e => {
  pointerActive = true;
  setPointer(e.clientX, e.clientY);
});
canvas.addEventListener('mousedown', e => {
  ensureAudio();
  pointerActive = true;
  setPointer(e.clientX, e.clientY);
});
canvas.addEventListener('touchstart', e => {
  ensureAudio();
  e.preventDefault();
  pointerActive = true;
  const t = e.touches[0];
  setPointer(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  setPointer(t.clientX, t.clientY);
}, { passive: false });

// ─── Entities ───
function spawnAsteroid(forceSize) {
  const size = forceSize || (Math.random() < 0.5 ? 'big' : (Math.random() < 0.5 ? 'mid' : 'small'));
  const r = size === 'big' ? 38 : size === 'mid' ? 24 : 14;
  const speedMul = (1 + (STATE.wave - 1) * 0.08) * DIFF[difficulty].astSpeedMul;
  const baseSpeed = (size === 'big' ? 0.7 : size === 'mid' ? 1.1 : 1.6) * speedMul;
  const points = [];
  const verts = 9;
  for (let i = 0; i < verts; i++) {
    const ang = (i / verts) * Math.PI * 2;
    points.push({ ang, dist: r * (0.78 + Math.random() * 0.35) });
  }
  STATE.asteroids.push({
    x: Math.random() * (W - r * 2) + r,
    y: -r * 2,
    vx: (Math.random() - 0.5) * 0.6,
    vy: baseSpeed + Math.random() * 0.6,
    r,
    size,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.04,
    points,
    hp: size === 'big' ? 3 : size === 'mid' ? 2 : 1,
    hue: 20 + Math.random() * 30
  });
}

function spawnEnemy() {
  const r = 18;
  STATE.enemies.push({
    x: Math.random() * (W - 60) + 30,
    y: -30,
    vx: (Math.random() < 0.5 ? -1 : 1) * (0.6 + Math.random() * 0.8),
    vy: 0.8 + Math.random() * 0.5 + STATE.wave * 0.04,
    r,
    hp: Math.max(1, 2 + Math.floor(STATE.wave / 4) + DIFF[difficulty].enemyHpDelta),
    fireCooldown: 80 + Math.random() * 60,
    phase: Math.random() * Math.PI * 2
  });
}

function spawnPowerup(x, y) {
  const types = ['shield', 'triple', 'rapid', 'life'];
  const weights = [3, 4, 4, 1];
  const total = weights.reduce((a, b) => a + b, 0);
  let pick = Math.random() * total;
  let type = 'shield';
  for (let i = 0; i < types.length; i++) {
    pick -= weights[i];
    if (pick <= 0) { type = types[i]; break; }
  }
  STATE.powerups.push({ x, y, vy: 1.2, r: 14, type, rot: 0 });
}

function spawnParticles(x, y, color, count = 14, speed = 4) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = Math.random() * speed + 0.5;
    STATE.particles.push({
      x, y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      r: Math.random() * 2.5 + 1,
      color
    });
  }
}

// ─── Shooting ───
function tryShoot(now) {
  const cooldown = STATE.rapidUntil > now ? 90 : 200;
  if (now - STATE.lastShot < cooldown) return;
  STATE.lastShot = now;
  const p = STATE.player;
  if (STATE.tripleUntil > now) {
    STATE.bullets.push({ x: p.x, y: p.y - p.r, vx: 0, vy: -10, r: 4 });
    STATE.bullets.push({ x: p.x, y: p.y - p.r, vx: -2.5, vy: -9.5, r: 4 });
    STATE.bullets.push({ x: p.x, y: p.y - p.r, vx: 2.5, vy: -9.5, r: 4 });
  } else {
    STATE.bullets.push({ x: p.x - 8, y: p.y - p.r + 4, vx: 0, vy: -10, r: 4 });
    STATE.bullets.push({ x: p.x + 8, y: p.y - p.r + 4, vx: 0, vy: -10, r: 4 });
  }
  sndShoot();
}

// ─── Wave Management ───
function startWave(n) {
  STATE.wave = n;
  STATE.killsThisWave = 0;
  STATE.waveTarget = Math.max(4, Math.round((6 + n * 2) * DIFF[difficulty].waveTargetMul));
  STATE.spawnTimer = 0;
  STATE.enemySpawnTimer = 60;
  document.getElementById('waveText').textContent = n;
  showWaveBanner(n);
  sndWave();
}

function showWaveBanner(n) {
  const b = document.getElementById('waveBanner');
  document.getElementById('waveBannerNum').textContent = n;
  b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 1200);
}

// ─── HUD ───
function updateHUD() {
  document.getElementById('score').textContent = STATE.score;
  const livesEl = document.getElementById('lives');
  livesEl.innerHTML = '';
  for (let i = 0; i < STATE.lives; i++) {
    const d = document.createElement('div');
    d.className = 'life-icon';
    livesEl.appendChild(d);
  }
  const ind = document.getElementById('powerIndicators');
  ind.innerHTML = '';
  const now = performance.now();
  if (STATE.shieldUntil > now) {
    const p = document.createElement('div');
    p.className = 'power-pill shield';
    p.textContent = 'KALKAN ' + Math.ceil((STATE.shieldUntil - now) / 1000) + 's';
    ind.appendChild(p);
  }
  if (STATE.tripleUntil > now) {
    const p = document.createElement('div');
    p.className = 'power-pill triple';
    p.textContent = 'ÜÇLÜ ATIŞ ' + Math.ceil((STATE.tripleUntil - now) / 1000) + 's';
    ind.appendChild(p);
  }
  if (STATE.rapidUntil > now) {
    const p = document.createElement('div');
    p.className = 'power-pill rapid';
    p.textContent = 'HIZLI ATIŞ ' + Math.ceil((STATE.rapidUntil - now) / 1000) + 's';
    ind.appendChild(p);
  }
}

// ─── Collisions ───
function hit(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  const rr = a.r + b.r;
  return dx * dx + dy * dy < rr * rr;
}

// ─── Update ───
function update(dt) {
  const now = performance.now();
  const p = STATE.player;

  // Move player toward pointer
  if (pointerActive) {
    p.tx = pointerX;
    p.ty = Math.max(60, Math.min(H - 30, pointerY));
  }
  p.x += (p.tx - p.x) * 0.18;
  p.y += (p.ty - p.y) * 0.18;
  p.glow = (p.glow + 0.06) % (Math.PI * 2);

  // Auto-fire
  tryShoot(now);

  // Stars
  for (const s of STATE.stars) {
    s.y += s.s;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }

  // Spawn asteroids
  STATE.spawnTimer--;
  if (STATE.spawnTimer <= 0 && STATE.killsThisWave < STATE.waveTarget) {
    STATE.spawnTimer = Math.max(20, 60 - STATE.wave * 3) * DIFF[difficulty].astSpawnMul;
    spawnAsteroid();
  }

  // Spawn enemies (from wave 2)
  if (STATE.wave >= 2) {
    STATE.enemySpawnTimer--;
    if (STATE.enemySpawnTimer <= 0 && STATE.enemies.length < 1 + Math.floor(STATE.wave / 3)) {
      STATE.enemySpawnTimer = (180 + Math.random() * 120) * DIFF[difficulty].enemySpawnMul;
      spawnEnemy();
    }
  }

  // Bullets
  for (let i = STATE.bullets.length - 1; i >= 0; i--) {
    const b = STATE.bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.y < -20 || b.x < -20 || b.x > W + 20) {
      STATE.bullets.splice(i, 1);
    }
  }

  // Enemy bullets
  for (let i = STATE.enemyBullets.length - 1; i >= 0; i--) {
    const b = STATE.enemyBullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) {
      STATE.enemyBullets.splice(i, 1);
      continue;
    }
    // Hit player
    if (hit(b, p)) {
      STATE.enemyBullets.splice(i, 1);
      damagePlayer();
    }
  }

  // Asteroids
  for (let i = STATE.asteroids.length - 1; i >= 0; i--) {
    const a = STATE.asteroids[i];
    a.x += a.vx;
    a.y += a.vy;
    a.rot += a.vr;
    if (a.x < a.r) { a.x = a.r; a.vx *= -1; }
    if (a.x > W - a.r) { a.x = W - a.r; a.vx *= -1; }
    if (a.y > H + a.r * 2) {
      STATE.asteroids.splice(i, 1);
      continue;
    }
    // Bullet hits
    for (let j = STATE.bullets.length - 1; j >= 0; j--) {
      const bl = STATE.bullets[j];
      if (hit(a, bl)) {
        STATE.bullets.splice(j, 1);
        a.hp--;
        spawnParticles(bl.x, bl.y, '255,210,79', 5, 2);
        if (a.hp <= 0) {
          asteroidDestroyed(a, i);
          break;
        } else {
          sndHit();
        }
      }
    }
    if (i >= STATE.asteroids.length) continue;
    // Hit player
    if (hit(a, p)) {
      asteroidDestroyed(a, i);
      damagePlayer();
    }
  }

  // Enemies
  for (let i = STATE.enemies.length - 1; i >= 0; i--) {
    const e = STATE.enemies[i];
    e.phase += 0.04;
    e.x += e.vx + Math.sin(e.phase) * 0.6;
    e.y += e.vy;
    if (e.x < e.r) { e.x = e.r; e.vx *= -1; }
    if (e.x > W - e.r) { e.x = W - e.r; e.vx *= -1; }
    if (e.y > H + 40) {
      STATE.enemies.splice(i, 1);
      continue;
    }
    e.fireCooldown--;
    if (e.fireCooldown <= 0 && e.y > 0 && e.y < H - 100) {
      e.fireCooldown = 90 + Math.random() * 80;
      const dx = p.x - e.x, dy = p.y - e.y;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const speed = 4.5;
      STATE.enemyBullets.push({
        x: e.x, y: e.y + e.r,
        vx: (dx / len) * speed,
        vy: (dy / len) * speed,
        r: 5
      });
      playTone(220, 0.05, 'square', 0.06);
    }
    // Bullet hits
    for (let j = STATE.bullets.length - 1; j >= 0; j--) {
      const bl = STATE.bullets[j];
      if (hit(e, bl)) {
        STATE.bullets.splice(j, 1);
        e.hp--;
        spawnParticles(bl.x, bl.y, '255,79,138', 5, 2);
        if (e.hp <= 0) {
          enemyDestroyed(e, i);
          break;
        } else {
          sndHit();
        }
      }
    }
    if (i >= STATE.enemies.length) continue;
    // Hit player
    if (hit(e, p)) {
      enemyDestroyed(e, i);
      damagePlayer();
    }
  }

  // Powerups
  for (let i = STATE.powerups.length - 1; i >= 0; i--) {
    const pu = STATE.powerups[i];
    pu.y += pu.vy;
    pu.rot += 0.05;
    if (pu.y > H + 30) {
      STATE.powerups.splice(i, 1);
      continue;
    }
    if (hit(pu, p)) {
      collectPowerup(pu.type);
      STATE.powerups.splice(i, 1);
    }
  }

  // Particles
  for (let i = STATE.particles.length - 1; i >= 0; i--) {
    const pt = STATE.particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vx *= 0.96;
    pt.vy *= 0.96;
    pt.life -= pt.decay;
    if (pt.life <= 0) STATE.particles.splice(i, 1);
  }

  // Shake decay
  if (STATE.shake > 0) STATE.shake *= 0.88;

  // Wave complete?
  if (STATE.killsThisWave >= STATE.waveTarget &&
      STATE.asteroids.length === 0 &&
      STATE.enemies.length === 0) {
    STATE.waveTimer++;
    if (STATE.waveTimer > 60) {
      STATE.waveTimer = 0;
      startWave(STATE.wave + 1);
    }
  }

  updateHUD();
}

function asteroidDestroyed(a, idx) {
  STATE.asteroids.splice(idx, 1);
  spawnParticles(a.x, a.y, '255,170,80', a.size === 'big' ? 20 : 12, a.size === 'big' ? 5 : 3);
  STATE.shake = Math.min(STATE.shake + (a.size === 'big' ? 8 : 4), 20);
  sndExplode();
  STATE.killsThisWave++;
  // Split big -> mid, mid -> small
  if (a.size === 'big') {
    for (let k = 0; k < 2; k++) {
      const child = createSplit(a, 'mid');
      STATE.asteroids.push(child);
    }
    STATE.score += Math.round(50 * DIFF[difficulty].scoreMul);
  } else if (a.size === 'mid') {
    for (let k = 0; k < 2; k++) {
      const child = createSplit(a, 'small');
      STATE.asteroids.push(child);
    }
    STATE.score += Math.round(30 * DIFF[difficulty].scoreMul);
  } else {
    STATE.score += Math.round(20 * DIFF[difficulty].scoreMul);
  }
  if (Math.random() < 0.12) spawnPowerup(a.x, a.y);
}

function createSplit(parent, size) {
  const r = size === 'mid' ? 24 : 14;
  const points = [];
  const verts = 9;
  for (let i = 0; i < verts; i++) {
    const ang = (i / verts) * Math.PI * 2;
    points.push({ ang, dist: r * (0.78 + Math.random() * 0.35) });
  }
  const speedMul = 1 + (STATE.wave - 1) * 0.08;
  return {
    x: parent.x, y: parent.y,
    vx: parent.vx + (Math.random() - 0.5) * 1.6,
    vy: parent.vy + (Math.random() - 0.2) * 0.8,
    r, size,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.06,
    points,
    hp: size === 'mid' ? 2 : 1,
    hue: 20 + Math.random() * 30
  };
}

function enemyDestroyed(e, idx) {
  STATE.enemies.splice(idx, 1);
  spawnParticles(e.x, e.y, '255,79,138', 22, 5);
  STATE.shake = Math.min(STATE.shake + 6, 20);
  sndExplode();
  STATE.score += Math.round(100 * DIFF[difficulty].scoreMul);
  STATE.killsThisWave++;
  if (Math.random() < 0.35) spawnPowerup(e.x, e.y);
}

function collectPowerup(type) {
  const now = performance.now();
  sndPower();
  if (type === 'shield') STATE.shieldUntil = now + 7000;
  else if (type === 'triple') STATE.tripleUntil = now + 8000;
  else if (type === 'rapid') STATE.rapidUntil = now + 7000;
  else if (type === 'life') STATE.lives = Math.min(STATE.lives + 1, 5);
  STATE.score += 25;
  spawnParticles(STATE.player.x, STATE.player.y, '255,210,79', 18, 3);
}

function damagePlayer() {
  const now = performance.now();
  if (now < STATE.invulnUntil) return;
  if (STATE.shieldUntil > now) {
    STATE.shieldUntil = now;
    STATE.invulnUntil = now + 800;
    spawnParticles(STATE.player.x, STATE.player.y, '142,255,182', 22, 4);
    sndHit();
    STATE.shake = Math.min(STATE.shake + 10, 24);
    return;
  }
  STATE.lives--;
  STATE.invulnUntil = now + 1500;
  STATE.shake = Math.min(STATE.shake + 16, 30);
  spawnParticles(STATE.player.x, STATE.player.y, '255,79,138', 30, 6);
  sndDamage();
  if (STATE.lives <= 0) gameOver();
}

function gameOver() {
  STATE.running = false;
  if (STATE.score > STATE.best) {
    STATE.best = STATE.score;
    localStorage.setItem('yildizAvcisiBest', String(STATE.best));
  }
  window.UzayHesap?.odul('yildiz-avcisi', STATE.score);
  document.getElementById('endScore').textContent = STATE.score;
  document.getElementById('endWave').textContent = STATE.wave;
  document.getElementById('endBest').textContent = STATE.best;
  document.getElementById('endTitle').textContent = 'GEMİ KAYBOLDU';
  document.getElementById('endTag').textContent = 'UZAY SİZİ HATIRLAYACAK';
  document.getElementById('endOverlay').classList.add('show');
}

// ─── Render ───
function render() {
  ctx.clearRect(0, 0, W, H);

  // Shake offset
  let sx = 0, sy = 0;
  if (STATE.shake > 0.5) {
    sx = (Math.random() - 0.5) * STATE.shake;
    sy = (Math.random() - 0.5) * STATE.shake;
  }
  ctx.save();
  ctx.translate(sx, sy);

  // Stars
  for (const s of STATE.stars) {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#cfdbff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Particles (under entities)
  for (const pt of STATE.particles) {
    ctx.globalAlpha = pt.life;
    ctx.fillStyle = `rgba(${pt.color}, ${pt.life})`;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r * pt.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Asteroids
  for (const a of STATE.asteroids) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.beginPath();
    for (let i = 0; i < a.points.length; i++) {
      const pt = a.points[i];
      const x = Math.cos(pt.ang) * pt.dist;
      const y = Math.sin(pt.ang) * pt.dist;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    const grad = ctx.createRadialGradient(-a.r * 0.3, -a.r * 0.3, 2, 0, 0, a.r);
    grad.addColorStop(0, `hsl(${a.hue}, 30%, 55%)`);
    grad.addColorStop(1, `hsl(${a.hue}, 35%, 22%)`);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = `hsl(${a.hue}, 25%, 14%)`;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  // Enemies
  for (const e of STATE.enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    // Body
    ctx.beginPath();
    ctx.moveTo(0, e.r);
    ctx.lineTo(e.r, -e.r * 0.4);
    ctx.lineTo(e.r * 0.4, -e.r * 0.7);
    ctx.lineTo(-e.r * 0.4, -e.r * 0.7);
    ctx.lineTo(-e.r, -e.r * 0.4);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, -e.r, 0, e.r);
    grad.addColorStop(0, '#ff4f8a');
    grad.addColorStop(1, '#7a1438');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#ff4f8a';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#ff4f8a';
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Cockpit
    ctx.beginPath();
    ctx.arc(0, -e.r * 0.2, e.r * 0.28, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd24f';
    ctx.fill();
    ctx.restore();
  }

  // Enemy bullets
  for (const b of STATE.enemyBullets) {
    ctx.save();
    ctx.shadowColor = '#ff4f8a';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ff7da8';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Bullets
  for (const b of STATE.bullets) {
    ctx.save();
    ctx.shadowColor = '#7df9ff';
    ctx.shadowBlur = 14;
    const grad = ctx.createLinearGradient(b.x, b.y - 10, b.x, b.y + 10);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(1, '#7df9ff');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, b.r * 0.7, b.r * 1.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Powerups
  for (const pu of STATE.powerups) {
    ctx.save();
    ctx.translate(pu.x, pu.y);
    ctx.rotate(pu.rot);
    let color = '#7df9ff', label = '?';
    if (pu.type === 'shield') { color = '#8effb6'; label = 'S'; }
    else if (pu.type === 'triple') { color = '#ffd24f'; label = '3'; }
    else if (pu.type === 'rapid') { color = '#ff7df9'; label = 'R'; }
    else if (pu.type === 'life') { color = '#ff4f8a'; label = '♥'; }
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ang = (i / 6) * Math.PI * 2;
      const x = Math.cos(ang) * pu.r;
      const y = Math.sin(ang) * pu.r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = `rgba(${hex2rgb(color)}, 0.15)`;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.rotate(-pu.rot);
    ctx.fillStyle = color;
    ctx.font = 'bold 14px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, 1);
    ctx.restore();
  }

  // Player
  const p = STATE.player;
  if (p) {
    const now = performance.now();
    const invuln = now < STATE.invulnUntil;
    const blink = invuln ? (Math.floor(now / 80) % 2) : 1;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.globalAlpha = blink ? 1 : 0.4;
    // Thruster
    const tflick = 0.6 + Math.sin(p.glow * 5) * 0.4;
    ctx.fillStyle = `rgba(125, 249, 255, ${tflick * 0.9})`;
    ctx.beginPath();
    ctx.moveTo(-6, p.r - 2);
    ctx.lineTo(0, p.r + 14 + tflick * 6);
    ctx.lineTo(6, p.r - 2);
    ctx.closePath();
    ctx.fill();
    // Ship body
    ctx.shadowColor = '#7df9ff';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(0, -p.r);
    ctx.lineTo(p.r * 0.85, p.r * 0.6);
    ctx.lineTo(p.r * 0.3, p.r * 0.4);
    ctx.lineTo(-p.r * 0.3, p.r * 0.4);
    ctx.lineTo(-p.r * 0.85, p.r * 0.6);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, -p.r, 0, p.r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.5, '#7df9ff');
    grad.addColorStop(1, '#3a78b8');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#cdf6ff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // Cockpit
    ctx.beginPath();
    ctx.ellipse(0, -p.r * 0.2, p.r * 0.25, p.r * 0.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#b44eff';
    ctx.shadowColor = '#b44eff';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    // Shield aura
    if (STATE.shieldUntil > now) {
      ctx.save();
      ctx.translate(p.x, p.y);
      const pulse = 1 + Math.sin(now * 0.008) * 0.06;
      ctx.strokeStyle = `rgba(142, 255, 182, ${0.5 + Math.sin(now * 0.005) * 0.2})`;
      ctx.lineWidth = 2;
      ctx.shadowColor = '#8effb6';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(0, 0, p.r * 1.8 * pulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  ctx.restore();
}

function hex2rgb(hex) {
  const h = hex.replace('#', '');
  const n = parseInt(h, 16);
  return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
}

// ─── Loop ───
let lastTime = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(now - lastTime, 50);
  lastTime = now;
  if (STATE.running) update(dt);
  render();
  requestAnimationFrame(loop);
}
loop();

// ─── Difficulty buttons ───
function syncDiffButtons() {
  document.querySelectorAll('.diff-btn').forEach(b => {
    if (b.dataset.diff === difficulty) b.classList.add('active');
    else b.classList.remove('active');
  });
}
function handleDiffClick(e) {
  const btn = e.target.closest('.diff-btn');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  difficulty = btn.dataset.diff;
  try { localStorage.setItem('yildizAvcisiDiff', difficulty); } catch (_) {}
  syncDiffButtons();
}
document.addEventListener('click', handleDiffClick, true);
document.addEventListener('touchstart', handleDiffClick, { capture: true, passive: false });
syncDiffButtons();

// ─── Start / Restart ───
function startGame() {
  ensureAudio();
  STATE.running = true;
  STATE.score = 0;
  STATE.lives = DIFF[difficulty].lives;
  STATE.wave = 1;
  STATE.bullets = [];
  STATE.asteroids = [];
  STATE.enemies = [];
  STATE.enemyBullets = [];
  STATE.particles = [];
  STATE.powerups = [];
  STATE.shake = 0;
  STATE.shieldUntil = 0;
  STATE.tripleUntil = 0;
  STATE.rapidUntil = 0;
  STATE.invulnUntil = 0;
  STATE.player = createPlayer();
  pointerX = W / 2;
  pointerY = H - 100;
  document.getElementById('startOverlay').classList.remove('show');
  document.getElementById('endOverlay').classList.remove('show');
  startWave(1);
  updateHUD();
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

updateHUD();
</script>
